name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端：测试 · 代码风格 · 类型检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: 单元测试
        run: python -m pytest -q
      - name: 代码风格（ruff）
        run: ruff check app tests
      - name: 类型检查（mypy）
        run: mypy

  frontend:
    name: 前端：模块语法 · 重名 · 构建一致性 · 隐私
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esprima
      - name: 项目自检
        run: python tools/check.py
