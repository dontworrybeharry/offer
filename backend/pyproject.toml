[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
# E701/E702：本项目前后端都用紧凑单行写法（if x: return y），不改
# C408：dict(company=…) 这种关键字写法在这里比 {} 字面量易读
ignore = ["E501", "B008", "RET504", "E701", "E702", "C408"]

[tool.mypy]
python_version = "3.10"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
