<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offer</title>
<style>

:root{
  --tc-blue:#0052D9; --tc-blue-6:#0052D9; --tc-blue-5:#377AF5; --tc-blue-2:#D9E1FF; --tc-blue-1:#F2F3FF;
  --tc-cyan:#00A4FF;
  --green:#2BA471; --green-bg:#E3F9E9;
  --orange:#E37318; --orange-bg:#FFF1E9;
  --red:#D54941;  --red-bg:#FFF0ED;
  --purple:#7B4BE0; --purple-bg:#F3EDFF;
  --gray:#8A8A8A;
  --t1:#181818; --t2:#454545; --t3:#767676; --t4:#A6A6A6;
  --bd:#E7E7E7; --bd-2:#DCDCDC;
  --bg:#F5F6F8; --card:#FFFFFF;
  --r:12px; --r-s:8px;
  --sh:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.05);
  --sh-h:0 2px 6px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.09);
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--t1); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--tc-blue);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#B0B0B0}

/* ---------- nav ---------- */
.nav{
  position:sticky;top:0;z-index:60;height:var(--nav-h);background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 28px;gap:32px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.3px;white-space:nowrap}
.brand .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--tc-blue) 0%,var(--tc-cyan) 100%);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.navlinks{display:flex;gap:2px;flex:1;overflow-x:auto}
.navlinks button{
  background:none;border:0;padding:8px 15px;border-radius:var(--r-s);cursor:pointer;
  color:var(--t2);font-size:14.5px;font-weight:500;white-space:nowrap;transition:.16s;
}
.navlinks button:hover{background:var(--tc-blue-1);color:var(--tc-blue)}
.navlinks button.on{background:var(--tc-blue);color:#fff;font-weight:600}
.navright{display:flex;gap:8px;align-items:center}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--bd-2);background:#fff;padding:7px 14px;border-radius:var(--r-s);cursor:pointer;
  font-size:13.5px;color:var(--t2);transition:.16s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--tc-blue);color:var(--tc-blue);background:var(--tc-blue-1)}
.btn.pri{background:var(--tc-blue);border-color:var(--tc-blue);color:#fff;font-weight:500}
.btn.pri:hover{background:#0040B3;border-color:#0040B3;color:#fff}
.btn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}

/* ---------- layout ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:26px 28px 90px}
.view{display:none;animation:fade .28s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:23px;font-weight:700;letter-spacing:-.2px}
.pagehead p{color:var(--t3);font-size:13.5px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}
.sechead{font-size:15.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sechead::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--tc-blue)}

/* ---------- hero ---------- */
.hero{border-radius:16px;padding:30px 32px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;
  background:linear-gradient(115deg,#0033A0 0%,#0052D9 45%,#00A4FF 100%)}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:320px;height:320px;border-radius:50%;
  background:rgba(255,255,255,.09)}
.hero::before{content:"";position:absolute;right:80px;bottom:-140px;width:230px;height:230px;border-radius:50%;
  background:rgba(255,255,255,.07)}
.hero h2{font-size:25px;font-weight:700;letter-spacing:-.3px}
.hero .sub{opacity:.86;margin-top:6px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-top:24px;position:relative;z-index:2}
.kpi{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:13px 15px}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.2}
.kpi span{font-size:12.5px;opacity:.85}

/* ---------- grid/stat ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* ---------- tags ---------- */
.tag{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12px;font-weight:500;line-height:19px;white-space:nowrap}
.t-blue{background:var(--tc-blue-1);color:var(--tc-blue)}
.t-green{background:var(--green-bg);color:var(--green)}
.t-orange{background:var(--orange-bg);color:var(--orange)}
.t-red{background:var(--red-bg);color:var(--red)}
.t-purple{background:var(--purple-bg);color:var(--purple)}
.t-gray{background:#F0F0F0;color:var(--t3)}

/* ---------- kanban ---------- */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 258px;background:#EEF0F3;border-radius:var(--r);padding:11px;min-height:96px}
.col.dragover{background:var(--tc-blue-2);outline:2px dashed var(--tc-blue)}
.colhead{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13.5px;padding:2px 4px 10px}
.colhead .n{background:#fff;border-radius:20px;padding:0 8px;font-size:12px;color:var(--t3);font-weight:600}
.jcard{background:#fff;border-radius:var(--r-s);padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.06);
  cursor:grab;border-left:3px solid var(--tc-blue);transition:.16s}
.jcard:hover{box-shadow:var(--sh-h);transform:translateY(-1px)}
.jcard .co{font-weight:600;font-size:13.5px}
.jcard .ro{color:var(--t3);font-size:12.5px;margin:2px 0 7px}
.jcard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--t4)}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:10px 12px;background:#FAFAFA;color:var(--t3);font-weight:600;font-size:12.5px;
  border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:var(--nav-h);z-index:5}
td{padding:11px 12px;border-bottom:1px solid #F2F2F2;vertical-align:top}
tr:hover td{background:#FBFCFF}

/* ---------- forms ---------- */
label{display:block;font-size:12.5px;color:var(--t3);margin-bottom:5px;font-weight:500}
.inp,select.inp,textarea.inp{
  width:100%;border:1px solid var(--bd-2);border-radius:var(--r-s);padding:8px 11px;background:#fff;
  outline:none;transition:.16s;font-size:13.5px}
.inp:focus{border-color:var(--tc-blue);box-shadow:0 0 0 3px var(--tc-blue-1)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.7}
.frow{display:grid;gap:13px;margin-bottom:13px}
.f2{grid-template-columns:1fr 1fr}
.f3{grid-template-columns:1fr 1fr 1fr}
.f4{grid-template-columns:1fr 1fr 1fr 1fr}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;display:none;align-items:flex-start;
  justify-content:center;padding:40px 20px;overflow-y:auto}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:820px;box-shadow:0 20px 60px rgba(0,0,0,.25);
  animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.mhead{padding:17px 22px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.mhead h3{font-size:16.5px;font-weight:700}
.mbody{padding:20px 22px;max-height:calc(100vh - 220px);overflow-y:auto}
.mfoot{padding:14px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:9px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--t4);line-height:1;padding:0 4px}
.x:hover{color:var(--t1)}

/* ---------- answer bank ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--bd-2);background:#fff;cursor:pointer;font-size:13px;
  color:var(--t2);transition:.16s;white-space:nowrap}
.chip:hover{border-color:var(--tc-blue);color:var(--tc-blue)}
.chip.on{background:var(--tc-blue);border-color:var(--tc-blue);color:#fff;font-weight:500}
.qa{border:1px solid var(--bd);border-radius:var(--r);background:#fff;margin-bottom:11px;overflow:hidden;transition:.16s}
.qa:hover{box-shadow:var(--sh)}
.qa>.q{padding:14px 18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qa>.q .txt{font-weight:600;font-size:14.5px;flex:1;line-height:1.55}
.qa>.q .arrow{color:var(--t4);transition:.2s;font-size:12px;margin-top:4px}
.qa.open>.q .arrow{transform:rotate(90deg)}
.qa>.a{display:none;padding:0 18px 18px;border-top:1px solid #F2F2F2}
.qa.open>.a{display:block}
.ablock{margin-top:14px}
.ablock h5{font-size:12.5px;color:var(--tc-blue);font-weight:700;margin-bottom:6px;letter-spacing:.4px}
.ablock .body{background:#FAFBFC;border:1px solid #EFEFEF;border-radius:var(--r-s);padding:12px 14px;
  white-space:pre-wrap;line-height:1.85;color:var(--t2);font-size:13.5px}
.followups{list-style:none}
.followups li{padding:7px 12px;background:#FFF8F0;border-left:3px solid var(--orange);border-radius:0 6px 6px 0;
  margin-bottom:6px;font-size:13px;color:var(--t2)}

/* ---------- mock ---------- */
.mockstage{max-width:880px;margin:0 auto}
.qbox{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:30px 32px;box-shadow:var(--sh);text-align:left}
.qnum{color:var(--t4);font-size:12.5px;letter-spacing:1px;font-weight:600}
.qtext{font-size:21px;font-weight:700;line-height:1.6;margin:12px 0 18px;letter-spacing:-.2px}
.timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;color:var(--tc-blue);letter-spacing:1px}
.timer.warn{color:var(--orange)}
.timer.over{color:var(--red)}
.progressbar{height:5px;background:#EDEDED;border-radius:3px;overflow:hidden;margin:14px 0 0}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--tc-blue),var(--tc-cyan));transition:.3s}
.rate{display:flex;gap:8px}
.rate button{width:36px;height:36px;border-radius:9px;border:1px solid var(--bd-2);background:#fff;cursor:pointer;font-weight:600}
.rate button.on{background:var(--tc-blue);color:#fff;border-color:var(--tc-blue)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:52px 20px;color:var(--t4)}
.empty .ic{font-size:40px;margin-bottom:10px;opacity:.5}
.muted{color:var(--t3);font-size:12.5px}
.src{font-size:11.5px;color:var(--t4)}
.src a{color:var(--t4);text-decoration:underline}
.timeline{list-style:none;position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--bd)}
.timeline li{position:relative;padding-bottom:14px}
.timeline li::before{content:"";position:absolute;left:-19px;top:6px;width:10px;height:10px;border-radius:50%;
  background:#fff;border:2px solid var(--tc-blue)}
.starcard{border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;background:#fff}
.starcard h4{font-size:15px;font-weight:700;margin-bottom:2px}
.starcard .role{color:var(--t3);font-size:12.5px;margin-bottom:11px}
.starcard dl{display:grid;grid-template-columns:44px 1fr;gap:7px 10px;font-size:13px}
.starcard dt{font-weight:700;color:var(--tc-blue);font-size:11.5px;padding-top:2px}
.starcard dd{color:var(--t2);line-height:1.7}
.datapts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:#181818;color:#fff;
  padding:11px 22px;border-radius:26px;font-size:13.5px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.searchbox{position:relative;flex:1;min-width:200px}
.searchbox input{width:100%;border:1px solid var(--bd-2);border-radius:20px;padding:8px 15px 8px 34px;outline:none;font-size:13.5px}
.searchbox input:focus{border-color:var(--tc-blue);box-shadow:0 0 0 3px var(--tc-blue-1)}
.searchbox::before{content:"⌕";position:absolute;left:13px;top:5px;color:var(--t4);font-size:17px}
@media(max-width:760px){
  .wrap{padding:18px 14px 80px}
  .nav{height:auto;flex-wrap:wrap;padding:9px 12px;gap:9px;position:static}
  .navlinks{order:3;flex-basis:100%;gap:4px}
  .navlinks button{padding:7px 11px;font-size:13.5px}
  .navright{margin-left:auto}
  th{position:static}
  .brand span.full{display:inline}
  .f2,.f3,.f4{grid-template-columns:1fr}
  .hero{padding:22px}
  .qtext{font-size:18px}
}
@media print{.nav,.btn,.filters{display:none!important}.wrap{max-width:none}}

/* ===== 快速投递 · 页面 ===== */
.rvx-h{font-size:14.5px;font-weight:700;color:var(--t1);margin-bottom:10px}
.rvx-p{font-size:13px;color:var(--t2);line-height:1.8}
.rvx-note{font-size:12px;color:var(--t3);line-height:1.7;margin-top:10px}
.rvx-row2{display:flex;gap:8px;flex-wrap:wrap}
.rvx-row2>.btn{flex:1;justify-content:center;text-align:center}
.rvx-wide{width:100%;justify-content:center;padding:10px 14px;font-size:14.5px;margin:12px 0 8px}
.rvx-more summary{cursor:pointer;font-size:13px;color:var(--t3);padding:4px 0;user-select:none}
.rvx-more[open] summary{margin-bottom:8px}

/* 第一步 */
.rvx-start{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.rvx-form{padding:22px 24px}
.rvx-steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.rvx-steps>div{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t3);
  background:var(--bg);border-radius:8px;padding:8px 10px}
.rvx-steps>div:first-child{background:var(--tc-blue-1);color:var(--tc-blue);font-weight:600}
.rvx-steps i{font-style:normal;width:20px;height:20px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.rvx-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.rvx-grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.rvx-grid5{display:grid;grid-template-columns:.8fr 2fr 1fr 1fr .8fr;gap:10px}
textarea.inp.rvx-jd{min-height:320px;line-height:1.75;margin-bottom:10px;resize:vertical}
.rvx-go{display:flex;gap:10px;margin-top:14px}
.rvx-big{flex:1;justify-content:center;padding:12px;font-size:15px}
.rvx-aside{display:flex;flex-direction:column;gap:12px}
.rvx-recent{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-radius:7px;cursor:pointer;font-size:13px}
.rvx-recent:hover{background:var(--tc-blue-1)}
.rvx-recent span:nth-child(2){color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvx-tip div:not(.rvx-h){font-size:12.5px;color:var(--t2);line-height:1.9}

/* 结果页头 */
.rvx-head{display:flex;align-items:center;gap:22px;padding:18px 22px;margin-bottom:14px;flex-wrap:wrap}
.rvx-title{flex:1;min-width:240px}
.rvx-co{font-size:13px;color:var(--t3);font-weight:500}
.rvx-role{font-size:21px;font-weight:700;line-height:1.35;margin:2px 0 8px}
.rvx-tags{display:flex;gap:6px;flex-wrap:wrap}
.rvx-score{position:relative;width:70px;height:70px;flex:none}
.rvx-score svg{width:70px;height:70px;transform:rotate(-90deg)}
.rvx-score circle{fill:none;stroke-width:3.2}
.rvx-score .bg{stroke:#EEF0F4}.rvx-score .fg{stroke:var(--tc-blue);stroke-linecap:round}
.rvx-score b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-variant-numeric:tabular-nums;padding-bottom:9px}
.rvx-score span{position:absolute;left:0;right:0;bottom:13px;text-align:center;font-size:10.5px;color:var(--t3)}
.rvx-acts{display:flex;gap:8px;flex-wrap:wrap}
.rvx-done{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.rvx-tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.rvx-tabs button{border:0;background:none;padding:10px 16px 9px;font-size:14px;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:0;white-space:nowrap;font-family:inherit}
.rvx-tabs button:hover{color:var(--t1)}
.rvx-tabs button.on{color:var(--tc-blue);border-bottom-color:var(--tc-blue);font-weight:600}

/* 一页简历 */
.rvx-cv{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.rvx-stage{background:linear-gradient(180deg,#E4E8EF,#EDF0F5);border-radius:var(--r);padding:28px 12px;display:flex;justify-content:center;overflow:hidden}
#rvWrap{position:relative}
#rvPaper{transform-origin:0 0;position:absolute;left:0;top:0;box-shadow:0 1px 3px rgba(0,0,0,.08),0 12px 36px rgba(20,40,80,.14)}
.rvx-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--nav-h) + 14px)}
.rvx-fit{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t3)}
.rvx-fit b{color:var(--t1);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.rvx-meter{flex:1;height:6px;background:#EEF0F4;border-radius:3px;overflow:hidden}
.rvx-meter i{display:block;height:100%;border-radius:3px;transition:none}
.rvx-meter i.good{background:var(--green)}.rvx-meter i.low{background:var(--orange)}.rvx-meter i.over{background:var(--red)}
.rvx-sec{font-size:11.5px;color:var(--t4);margin:10px 0 2px;letter-spacing:.5px}
.rvx-sec:first-child{margin-top:0}
.rvx-tog{display:flex;align-items:center;gap:9px;padding:6px 4px;cursor:pointer;font-size:13px;margin:0;color:var(--t1);font-weight:400}
.rvx-tog input{display:none}
.rvx-tog .sw{width:28px;height:16px;border-radius:8px;background:#D9DDE3;position:relative;flex:none;transition:background .2s}
.rvx-tog .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.rvx-tog.on .sw{background:var(--tc-blue)}
.rvx-tog.on .sw::after{left:14px}
.rvx-tog .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvx-tog:not(.on) .nm{color:var(--t3)}
.rvx-tog .ct{font-size:12px;color:var(--t4);font-variant-numeric:tabular-nums}
.rvx-tog.lock{cursor:default}.rvx-tog.lock .nm{color:var(--t4)}
.rvx-tog.lock .btn{padding:2px 8px;font-size:11.5px}
.rvx-chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.65;color:var(--t2);font-weight:400;padding:6px 0;border-top:1px dashed #EDEDED;margin:0;cursor:pointer}

/* 网申 */
.rvx-apply{display:flex;flex-direction:column;gap:12px}
.rvx-reg{border-left:3px solid var(--tc-blue)}
.rvx-applybar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;padding:0 4px}
.rvx-switch{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--t2);cursor:pointer}
.rvx-fs{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.rvx-f{display:grid;grid-template-columns:118px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #F2F3F5;font-size:13px}
.rvx-f .lb{color:var(--t3)}
.rvx-f .vl{color:var(--t1);word-break:break-all}
.rvx-f .cn{font-size:11.5px;color:var(--t4);font-variant-numeric:tabular-nums}
.rvx-f.long{align-items:start}
.rvx-f.long .vl{line-height:1.8;background:#FAFBFC;border-radius:6px;padding:8px 10px}
.rvx-f .btn{padding:3px 10px}
.rvx-exp{border:1px solid #EEF0F3;border-radius:10px;padding:4px 14px 6px;margin-top:10px}
.rvx-exp-h{display:flex;justify-content:space-between;gap:10px;padding:8px 0 4px;font-size:13.5px;flex-wrap:wrap}
.rvx-exp-h span{color:var(--t3);font-size:12.5px}

/* 岗位分析 / 深度分析（沿用） */
.rvq-sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rvq-sum>div{flex:1;min-width:120px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.rvq-sum .muted{font-size:12px}
.rvq-score{font-size:24px;color:var(--tc-blue);font-variant-numeric:tabular-nums}
.rvq-kv{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed #ECECEC;font-size:13px;line-height:1.7}
.rvq-kv:last-child{border-bottom:0}
.rvq-kv>span{color:#888}
.rvq-kv em{font-style:normal;font-size:11px;background:var(--orange-bg);color:var(--orange);border-radius:4px;padding:0 4px;margin-left:4px}
.rvq-skill{padding:8px 0;border-bottom:1px dashed #ECECEC;font-size:13px;line-height:1.7}
.rvq-skill:last-child{border-bottom:0}
.rvq-skill .tag{margin-left:6px}
.rvq-fix{color:var(--orange);font-size:12.5px}
.rvq-list{display:flex;flex-direction:column}
.rvq-item{display:grid;grid-template-columns:44px 1fr 64px;gap:4px 10px;padding:10px 0;border-bottom:1px solid #F0F0F0;align-items:start;font-size:13px;line-height:1.65}
.rvq-item .tag{justify-self:start;white-space:nowrap}
.rvq-ev{grid-column:2/4;color:#6B7280;font-size:12.5px}
.rvq-qq{padding:7px 0;border-bottom:1px dashed #ECECEC;font-size:13.5px;line-height:1.6}
.rvq-prompt{white-space:pre-wrap;font-size:12px;line-height:1.6;background:#F7F8FA;border-radius:8px;padding:12px;max-height:360px;overflow:auto}
.rvq-md{font-size:13.5px;line-height:1.8}
.rvq-md h4{margin:10px 0 4px;font-size:14.5px}

@media (max-width:1100px){
  .rvx-start,.rvx-cv{grid-template-columns:1fr}
  .rvx-side{position:static}
  .rvx-grid5{grid-template-columns:1fr 1fr}
  .rvx-fs{grid-template-columns:1fr}
}
@media (max-width:640px){
  .rvx-grid2,.rvx-grid3,.rvx-grid5{grid-template-columns:1fr}
  .rvx-f{grid-template-columns:1fr auto}
  .rvx-f .lb{grid-column:1/-1}
}

/* ===== 一页简历 · 与 Word 母版逐项对应（单位 pt，行距为固定值，与导出的 docx 一致）=====
   页边距 上 24.1 右 42.5 下 19.85 左 42.5；正文 宋体 10pt；标题 微软雅黑；主色 #0052D9 */
.rv-page{width:210mm;height:297mm;box-sizing:border-box;background:#fff;overflow:hidden;
  padding:24.1pt 42.5pt 19.85pt 42.5pt;box-shadow:0 2px 14px rgba(0,0,0,.12);
  font-family:"SimSun","宋体","Songti SC","STSong",serif;font-size:10.5pt;color:#404040;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.rv-page .rv-in{display:flow-root}
.rv-page b,.rv-name,.rv-h,.rv-e{font-family:"Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB",sans-serif}
.rv-name{font-size:22pt;font-weight:700;color:#1F1F1F;text-align:center;line-height:30pt;padding-bottom:1pt;white-space:pre}
.rv-ct{font-size:10pt;color:#404040;text-align:center;line-height:14pt;padding-bottom:3pt}
.rv-h{font-size:13pt;font-weight:700;color:#0052D9;line-height:19pt;padding-top:4pt;margin-bottom:2pt;
  border-bottom:1pt solid #0052D9;padding-bottom:1pt}
.rv-e{display:flex;justify-content:space-between;gap:10pt;line-height:16.5pt;padding:2pt 0 .5pt;color:#404040}
.rv-e .l{font-size:11pt;font-weight:700;color:#1F1F1F;white-space:pre-wrap}
.rv-e .l i{font-style:normal;font-weight:400;font-size:10.5pt;color:#404040}
.rv-e .d{font-size:10.5pt;white-space:nowrap}
.rv-b{line-height:14pt;padding:.3pt 0;padding-left:15.75pt;text-indent:-15.75pt;text-align:justify;color:#404040}
.rv-b .bu{color:#0052D9;font-size:9.5pt}
.rv-b b{color:#1F1F1F;font-weight:700}
.rv-b.rv-k .bu{color:#1F1F1F;font-size:7.5pt}
.rv-b.rv-k b{font-family:"SimSun","宋体","Songti SC","STSong",serif;color:#404040}
.rv-page.rv-meas{position:absolute;left:-10000px;top:0;visibility:hidden;box-shadow:none;font-family:"SimSun","宋体","Osaka-Mono",monospace}
.rv-page.rv-meas .rv-b.rv-k b{font-family:"SimSun","宋体","Osaka-Mono",monospace}

/* 打印只输出简历本身 */
#rvPrintHost{display:none}
@media print{
  body.rv-printing>*{display:none!important}
  body.rv-printing>.mask{display:none!important}
  body.rv-printing>#rvPrintHost{display:block!important}
  body.rv-printing #rvPrintHost .rv-page{box-shadow:none!important;margin:0!important}
  @page{size:A4;margin:0}
}

/* 能力覆盖 */
.rvx-caps{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.rvx-cap{display:grid;grid-template-columns:18px auto auto 1fr;gap:6px;align-items:baseline;font-size:13px;padding:6px 0;border-bottom:1px dashed #EEE}
.rvx-cap .ic{font-weight:700}.rvx-cap.ok .ic{color:var(--green)}.rvx-cap.no .ic{color:var(--red)}
.rvx-cap .ev{grid-column:2/-1;color:var(--t3);font-size:12px;line-height:1.6}
.rvx-cap .tag{font-size:10.5px;padding:0 5px;line-height:16px}
.rvx-capsum{font-size:12.5px;color:var(--t3);margin-bottom:8px}
.rvx-chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:5px;margin:0 4px 5px 0;cursor:default}
.rvx-chip.ok{background:var(--green-bg);color:var(--green)}
.rvx-chip.no{background:#F4F5F7;color:var(--t4)}
.rvx-abroad-hit{border-left:3px solid var(--purple)}

/* 留学生机会 */
.rvx-ab-top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.rvx-ab-in{display:flex;gap:16px;align-items:flex-end;margin-top:12px;flex-wrap:wrap}
.rvx-ab-in>div:first-child{min-width:220px}
.rvx-ab-res{font-size:14px;padding-bottom:9px}
.rvx-ab-res b{font-size:22px;color:var(--tc-blue)}
.rvx-warn{margin-top:12px;font-size:13px;line-height:1.75;color:var(--red);background:var(--red-bg);border-radius:8px;padding:9px 12px}
.rvx-okline{margin-top:12px;font-size:13px;line-height:1.75;color:var(--t2);background:var(--tc-blue-1);border-radius:8px;padding:9px 12px}
.rvx-sell{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px dashed #EEE}
.rvx-sell b{color:var(--t3);font-weight:500}
.rvx-tablewrap{overflow-x:auto}
.rvx-tb{width:100%;border-collapse:collapse;font-size:13px}
.rvx-tb th{text-align:left;font-weight:500;color:var(--t3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;position:static;background:none}
.rvx-tb td{padding:10px;border-bottom:1px solid #F2F3F5;vertical-align:top;line-height:1.6}
.rvx-tb td.nw{white-space:nowrap}
.rvx-tb td.sm{font-size:12.5px;color:var(--t2);min-width:260px}
.rvx-tb .src{display:block;font-size:11.5px;color:var(--t4);margin-top:2px}
.rvx-st{display:inline-block;font-size:12px;padding:1px 8px;border-radius:5px;white-space:nowrap}
.rvx-st.ok{background:var(--green-bg);color:var(--green)}
.rvx-st.edge{background:var(--orange-bg);color:var(--orange)}
.rvx-st.no{background:var(--red-bg);color:var(--red)}
.rvx-st.unk,.rvx-st.check{background:#F2F3F5;color:var(--t3)}
.rvx-abi{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid #F2F3F5}
.rvx-abi span:nth-child(2){color:var(--t2)}
@media (max-width:1100px){.rvx-ab-top,.rvx-caps{grid-template-columns:1fr}}
.rvx-audit{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.rvx-audit b{font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.rvx-audit b.g{color:var(--green)}.rvx-audit b.m{color:var(--orange)}.rvx-audit b.l{color:var(--red)}
.rvx-audit span{font-size:13px;color:var(--t2)}
.rvx-ai{font-size:12.5px;line-height:1.65;padding:2px 0}
.rvx-ai.ok{color:var(--t2)}.rvx-ai.no{color:var(--orange)}
.rvx-sub{font-size:11.5px;color:var(--t4);margin:8px 0 2px}
.rvx-ask{font-size:12.5px;line-height:1.65;padding:5px 0;border-top:1px dashed #EEE;color:var(--t2)}
.rvx-ask b{display:block;color:var(--t1);font-weight:600}
.rvx-fixbox{font-size:12.5px;line-height:1.7;background:var(--tc-blue-1);color:var(--t1);border-radius:7px;padding:8px 10px;margin-top:6px}

/* 照片抬头：总高 84pt，与 Word 中的固定行距一致 */
.rv-head{position:relative;height:84pt;box-sizing:border-box}
.rv-head .rv-name,.rv-head .rv-ct{padding-left:67pt;padding-right:67pt}
.rv-head .rv-ct{padding-bottom:0}
.rv-head .rv-ct:last-child{padding-bottom:3pt}
.rv-photo{position:absolute;top:0;right:0;width:57pt;height:80pt;object-fit:cover}
.rvx-photo-row{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.rvx-photo-row img{width:42px;height:59px;object-fit:cover;border-radius:3px;border:1px solid var(--bd)}
.rvx-photo-row .btn{margin-right:4px}
.rvx-edit{display:grid;gap:6px;padding:10px 0;border-bottom:1px dashed #EEE}

/* 简历历史编辑器 */
.rvx-editing [contenteditable]{outline:none;border-radius:2px;cursor:text}
.rvx-editing [contenteditable]:hover{background:rgba(0,82,217,.06)}
.rvx-editing [contenteditable]:focus{background:rgba(0,82,217,.1);box-shadow:0 0 0 1px rgba(0,82,217,.35)}
.rvx-hist{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 6px;border-radius:7px;cursor:pointer;font-size:13px;border-bottom:1px dashed #EEE}
.rvx-hist:hover{background:var(--tc-blue-1)}
.rvx-hist span{color:var(--t3);font-size:12px}
.rvx-hist.on{background:var(--tc-blue-1)}
.rvx-photo-box{display:flex;gap:12px;align-items:flex-start}
.rvx-photo-box img,.rvx-photo-box .ph{width:64px;height:90px;object-fit:cover;border-radius:4px;border:1px solid var(--bd);flex:none}
.rvx-photo-box .ph{display:grid;place-items:center;background:#F5F6F8;color:var(--t4);font-size:12px;border-style:dashed}
.rvx-photo-box .btn{margin:0 4px 6px 0}

.rvx-aisel{width:auto;flex:0 0 auto;padding:6px 8px}
.rvx-row2 .rvx-aisel{max-width:120px}

/* ===== AI 助手 ===== */
.agx{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.agx-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--nav-h) + 14px)}
.agx-main{display:flex;flex-direction:column;height:calc(100vh - var(--nav-h) - 150px);min-height:520px;overflow:hidden}
.agx-set{border-left:3px solid var(--tc-blue);flex:none}
.agx-prov{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.agx-prov button{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 4px;cursor:pointer;font-family:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.3}
.agx-prov button b{font-weight:600}
.agx-prov button i{font-style:normal;font-size:11px;color:var(--mute,#888)}
.agx-prov button i.free{color:#1a7f37}
.agx-prov button.on{background:var(--tc-blue);color:#fff;border-color:var(--tc-blue)}
.agx-prov button.on i{color:rgba(255,255,255,.85)}
.app-timeline{display:flex;flex-direction:column;gap:10px}.app-tile{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--bd);cursor:pointer}.app-line{width:150px;display:flex;gap:7px;align-items:flex-start;font-size:12px;flex-wrap:wrap}.app-dot{width:10px;height:10px;border-radius:50%;background:var(--tc-blue);margin-top:4px;flex:none}.app-body{flex:1;min-width:0}.app-body .co{font-weight:650}.app-body .ro{margin-top:3px}.app-actions{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}.app-actions .inp{width:auto;min-width:120px}
.agx-model{display:flex;flex-direction:column;gap:2px;font-size:13px;margin-bottom:8px}
.agx-model span{color:var(--t3);font-size:12px;word-break:break-all}
.agx-msgs{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.agx-u{align-self:flex-end;max-width:78%;background:var(--tc-blue);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.agx-a{align-self:flex-start;max-width:88%;background:#F5F6F8;border-radius:14px 14px 14px 4px;padding:12px 16px;font-size:14px;line-height:1.8;word-break:break-word}
.agx-a h4{margin:8px 0 4px;font-size:14.5px}
.agx-a li{margin-left:18px}
.agx-tool{align-self:flex-start;font-size:12.5px;color:var(--t3);display:flex;gap:6px;align-items:center;padding:2px 4px}
.agx-tool em{font-style:normal;color:var(--t4)}
.agx-tool.done span{color:var(--green)}.agx-tool.error{color:var(--red)}
.agx-card{align-self:flex-start;border:1px solid var(--bd);border-left:3px solid var(--tc-blue);border-radius:10px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:10px;min-width:340px}
.agx-card>div:first-child{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.agx-card span{font-size:12px;color:var(--t3)}
.agx-err{align-self:stretch;background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px 14px;font-size:13px;white-space:pre-wrap}
.agx-composer{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--bd);background:#fff}
.agx-composer textarea{min-height:52px;max-height:200px;resize:vertical;flex:1;font-size:14px;line-height:1.6}
.agx-composer .btn{align-self:flex-end;padding:10px 20px}
.agx-empty{margin:auto;max-width:680px;text-align:center;padding:20px 0}
.agx-hi{font-size:22px;font-weight:700}
.agx-sub{color:var(--t3);font-size:13.5px;margin:6px 0 18px;line-height:1.7}
.agx-starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;text-align:left}
.agx-starters button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-family:inherit}
.agx-starters button:hover{border-color:var(--tc-blue);background:var(--tc-blue-1)}
.agx-starters b{font-size:13.5px}.agx-starters span{font-size:12px;color:var(--t3);line-height:1.5}
.agx-typing{align-self:flex-start;display:flex;gap:4px;padding:10px 14px;background:#F5F6F8;border-radius:12px}

.agx-typing i:nth-child(2){animation-delay:.15s}.agx-typing i:nth-child(3){animation-delay:.3s}
@keyframes agdot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (max-width:1000px){.agx{grid-template-columns:1fr}.agx-side{position:static}.agx-main{height:70vh}}

.agx-bm{display:flex;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
.agx-bm .btn{min-width:140px;justify-content:center}

/* ===== 自动投递 ===== */
.apx-top{margin-bottom:14px}
.apx-status{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;margin-bottom:12px}
.apx-status .ok{color:#2BA471;font-weight:600}.apx-status .warn{color:#E37318;font-weight:600}

.apx-log span{color:#999;font-variant-numeric:tabular-nums}
.apx-log.ok div{color:#2BA471}.apx-log.warn div{color:#E37318}.apx-log.err div{color:#D54941}.apx-log.head div{font-weight:600}
#apLog{max-height:560px;overflow:auto}
.apx-src{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0}
.apx-src a{display:block;font-size:12px;color:var(--mute,#767676);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.apx-add{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.apx-add #apSrcUrl{grid-column:1/-1}.apx-add button{grid-column:1/-1}
.apx-pre{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.apx-fs{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;font-size:13px}
.apx-set .rvx-switch{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:13px;line-height:1.6}
@media (max-width:760px){.apx-sch{margin-left:0}.apx-fs{grid-template-columns:1fr}.apx-flow i{display:none}}
.apx-new{font-style:normal;font-size:11px;background:#D54941;color:#fff;border-radius:8px;padding:0 6px;margin-left:4px;line-height:16px;display:inline-block}
.apx-feed{padding:6px 16px}
.apx-day{font-size:12px;color:var(--mute,#767676);font-weight:600;margin:12px 0 4px}
.apx-fi{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 0;border-bottom:1px solid #f2f2f2;font-size:13.5px}
.apx-ft{color:#999;font-variant-numeric:tabular-nums;width:44px}
.apx-fr a{color:inherit}.apx-fr a:hover{color:var(--tc-blue)}
.apx-libh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.apx-libh .btn.pri{margin-left:auto}
.apx-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.apx-cats button{border:1px solid var(--bd);background:#fff;border-radius:14px;padding:3px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.apx-cats button.on{background:var(--tc-blue);border-color:var(--tc-blue);color:#fff}
.apx-lib{display:flex;flex-wrap:wrap;gap:6px}
.apx-co{border:1px solid;border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;background:#fff}
.apx-co.auto{border-color:#9ED8B9;color:#1a7f37}.apx-co.man{border-color:#F5C28C;color:#B25E00}
.apx-co.on{background:#1a7f37;border-color:#1a7f37;color:#fff}

.rvx-step{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px dashed #EEE;cursor:pointer;font-size:13.5px;color:var(--t2)}
.rvx-step span{width:20px;color:var(--t4)}
.rvx-step.ok{color:var(--t4);text-decoration:line-through}.rvx-step.ok span{color:var(--green)}
.rvx-funnel{display:grid;grid-template-columns:90px 1fr 30px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.rvx-funnel b{text-align:right;font-variant-numeric:tabular-nums}
.rvx-expcard{background:#FCFCFD}
.rvx-bl{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:start;margin-top:8px}
.rvx-hint{font-size:12px;margin-top:3px;line-height:1.7}
.colhead{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin:2px 4px 10px}
.colhead .n{color:var(--t4);font-weight:500}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--t3)}
@media (max-width:760px){.rvx-bl{grid-template-columns:1fr}}


/*@QZ:shell.css*/

/* =========================================================================
   Offer · 界面层 v3（两个版本共用，最后加载，覆盖旧样式）
   依据：impeccable（Operate 模式、craft-floor）+ ui-ux-pro-max（求职/简历类产品：Flat + Swiss）
   · 一个无衬线字族，层级只靠字号与字重（约 1.2 比例）
   · Restrained：中性底 + 一个强调色（只用于选中、焦点、链接、图表）；主按钮用墨色
   · 平面：不用阴影做装饰，只有浮层（弹窗、命令面板、提示）有投影
   · 不用：标题上方小标签、指标大数字模板、图标方块、同款卡片网格、脉冲点、进场动画
   ========================================================================= */
:root{
  --ink:#15181D; --ink-2:#2B2F36;
  --t1:#15181D; --t2:#3F444C; --t3:#5E646E; --t4:#61676F;
  --bg:#FFFFFF; --bg-2:#F4F5F7; --bg-3:#ECEEF1; --card:#FFFFFF;
  --bd:#E3E5E9; --bd-2:#D3D6DB;
  --acc:#2150D6; --acc-h:#1A41B0; --acc-soft:#EAF0FD;
  --ok:#177245; --ok-bg:#E8F4EE; --warn:#8F5200; --warn-bg:#FBF1E1; --bad:#B42318; --bad-bg:#FCEBE9;
  /* 旧变量映射到新体系，旧页面自动跟随 */
  --tc-blue:var(--acc); --tc-blue-6:var(--acc); --tc-blue-5:#4A70E0; --tc-blue-2:#D5E0FA; --tc-blue-1:var(--acc-soft); --tc-cyan:var(--acc);
  --green:var(--ok); --green-bg:var(--ok-bg); --orange:var(--warn); --orange-bg:var(--warn-bg); --red:var(--bad); --red-bg:var(--bad-bg);
  --purple:#5B4AB8; --purple-bg:#EFEDFA; --gray:var(--t4);
  --r:8px; --r-s:6px; --sh:none; --sh-h:none;
  --side:228px; --nav-h:52px;
  --fs-meta:12px; --fs-sm:13px; --fs-body:14px; --fs-h2:15px; --fs-h1:20px;
  --ease:cubic-bezier(.22,1,.36,1);
}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:var(--fs-body);line-height:1.6;color:var(--t1);background:var(--bg);letter-spacing:0;caret-color:var(--acc)}
::selection{background:#D5E0FA;color:var(--t1)}
a{color:var(--acc);text-underline-offset:2px}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
button,[onclick],summary,select,label[for]{cursor:pointer}
button:disabled,.btn:disabled{cursor:not-allowed;opacity:.45}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CDD1D7;border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#AEB3BB;background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}
.num,td.num,th.num{font-variant-numeric:tabular-nums;text-align:right}
.muted{color:var(--t3);font-size:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nowrap{white-space:nowrap}
.qi{flex:none;display:block}
.view,.view.on{animation:none}

/* ---------- 侧栏（第二层中性色） ---------- */
.nav{position:fixed;left:0;top:0;bottom:0;width:var(--side);height:auto;display:flex;flex-direction:column;align-items:stretch;gap:0;
  padding:14px 10px 12px;background:var(--bg-2);border-right:1px solid var(--bd);border-bottom:0;backdrop-filter:none;z-index:60;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px;color:var(--t1)}
.brand .qz-logo{width:26px;height:26px;flex:none;border-radius:7px}
.brand .qz-bn{font-size:14.5px;font-weight:600}
.navlinks{display:flex;flex-direction:column;gap:1px;flex:1;overflow:visible}
.qz-grp{font-size:var(--fs-meta);font-weight:500;color:var(--t4);padding:14px 8px 4px}
.navlinks button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border:0;border-radius:6px;background:transparent;
  font:inherit;font-size:var(--fs-body);font-weight:450;color:var(--t2);text-align:left;transition:background .15s var(--ease),color .15s var(--ease)}
.navlinks button .qi{color:var(--t4)}
.navlinks button:hover{background:var(--bg-3);color:var(--t1)}
.navlinks button.on{background:#FFFFFF;color:var(--t1);font-weight:600;box-shadow:inset 0 0 0 1px var(--bd)}
.navlinks button.on .qi{color:var(--acc)}
.navlinks button span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qz-badge{font-style:normal;font-size:11.5px;font-weight:600;min-width:20px;height:18px;line-height:18px;padding:0 6px;border-radius:9px;background:var(--ink);color:#fff;text-align:center;font-variant-numeric:tabular-nums}
.qz-badge:empty{display:none}
.navright{display:flex;flex-direction:column;align-items:stretch;gap:6px;border-top:1px solid var(--bd);padding:10px 0 0;margin-top:10px}
.navright .btn{justify-content:center;background:transparent}
.qz-ext{display:flex;align-items:center;gap:7px;font-size:var(--fs-meta);color:var(--t3);padding:0 8px 4px}
.qz-ext i{width:7px;height:7px;border-radius:50%;background:#B7BCC4}
.qz-ext.on i{background:var(--ok)}

/* ---------- 主区与顶栏 ---------- */
.wrap{margin-left:var(--side);max-width:none;padding:0 40px 96px}
.wrap>.view{max-width:1200px;margin-left:auto;margin-right:auto}
.qz-top{position:sticky;top:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;gap:14px;margin:0 -40px 28px;padding:0 40px;
  background:rgba(255,255,255,.94);border-bottom:1px solid var(--bd)}
.qz-crumb{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);min-width:0}
.qz-crumb span{color:var(--t4)}
.qz-crumb span::after{content:"/";margin-left:8px;color:var(--bd-2)}
.qz-crumb b{font-weight:600}
.qz-search{margin-left:auto;display:flex;align-items:center;gap:8px;width:280px;max-width:40vw;height:32px;padding:0 6px 0 10px;border:1px solid var(--bd);
  border-radius:6px;background:var(--bg-2);color:var(--t4);font:inherit;font-size:var(--fs-sm);transition:border-color .15s var(--ease),background .15s var(--ease)}
.qz-search:hover{border-color:var(--bd-2);background:#fff}
.qz-search span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:inherit;font-size:11px;color:var(--t3);background:#fff;border:1px solid var(--bd);border-radius:4px;padding:0 5px;line-height:17px}

/* ---------- 页头与区块 ---------- */
.pg-h,.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 24px;flex-wrap:wrap}
.pg-h h1,.pagehead h1{font-size:var(--fs-h1);font-weight:600;line-height:1.3;letter-spacing:0;font-family:inherit}
.pg-h p,.pagehead p{font-size:var(--fs-sm);color:var(--t3);margin-top:4px;max-width:72ch;line-height:1.6}
.pg-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#v-auto>.pagehead,.hero,.kpis,.agx-dash,.empty .ic{display:none}
.sec-h,.sechead{font-size:var(--fs-h2);font-weight:600;margin:0 0 10px;display:block}
.sechead::before{display:none}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:32px}
.sec-row .sec-h{margin-bottom:10px}
.notice{display:flex;gap:9px;align-items:flex-start;background:var(--bg-2);border-radius:6px;padding:10px 12px;font-size:var(--fs-sm);color:var(--t2);margin:0 0 20px;line-height:1.6}
.notice .qi{color:var(--t3);margin-top:2px}
.run-note{font-size:var(--fs-sm);color:var(--t3);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inline-sel{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--t3);margin:0}
.inline-sel select{width:auto;height:32px;padding:0 8px}
.empty-block{border:1px dashed var(--bd-2);border-radius:var(--r);padding:36px 24px;text-align:center;color:var(--t3)}
.empty-block h2{font-size:var(--fs-h2);color:var(--t1);font-weight:600;margin-bottom:6px}
.empty-block p{max-width:52ch;margin:0 auto 14px}
.empty-block .btn{margin-top:4px}

/* ---------- 控件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--bd-2);border-radius:6px;background:#fff;
  color:var(--t1);font:inherit;font-size:var(--fs-sm);font-weight:500;white-space:nowrap;text-decoration:none;box-shadow:none;
  transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.btn:hover{background:var(--bg-2);border-color:#BFC3CA;color:var(--t1);text-decoration:none}
.btn:active{background:var(--bg-3)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2)}
.btn.ghost:hover{background:var(--bg-3);color:var(--t1)}
.btn.danger:hover{color:var(--bad);border-color:#E6B4AE;background:var(--bad-bg)}
.inp,select.inp,textarea.inp{border:1px solid var(--bd-2);border-radius:6px;background:#fff;font:inherit;font-size:var(--fs-body);color:var(--t1);
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.inp:hover{border-color:#BFC3CA}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.inp::placeholder,input::placeholder,textarea::placeholder{color:#6E747E}
label{color:var(--t2);font-size:var(--fs-sm);font-weight:500}
.tag{display:inline-block;border-radius:4px;font-size:12px;font-weight:500;padding:0 6px;line-height:20px;background:var(--bg-3);color:var(--t2)}
.t-blue{background:var(--acc-soft);color:var(--acc)}.t-green{background:var(--ok-bg);color:var(--ok)}.t-orange{background:var(--warn-bg);color:var(--warn)}
.t-red{background:var(--bad-bg);color:var(--bad)}.t-purple{background:var(--purple-bg);color:var(--purple)}.t-gray{background:var(--bg-3);color:var(--t3)}
.chip{border-radius:6px;padding:4px 10px;font-size:var(--fs-sm);border:1px solid var(--bd-2);background:#fff;color:var(--t2)}
.chip:hover{border-color:#BFC3CA;color:var(--t1)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:none}
.pad{padding:18px 20px}
.grid{gap:20px}
/* 分段选择：类别、结果 */
.seg{display:flex;flex-wrap:wrap;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 10px;font:inherit;font-size:var(--fs-sm);color:var(--t2);transition:background .15s var(--ease)}
.seg button .num{color:var(--t4);margin-left:2px}
.seg button:hover{background:var(--bg-2);color:var(--t1)}
.seg button.on{background:var(--bg-3);color:var(--t1);font-weight:600}
/* 标签页：下划线 */
.tabs,.rvx-tabs{display:flex;gap:22px;border-bottom:1px solid var(--bd);margin:0 0 18px}
.tabs button,.rvx-tabs button{border:0;background:transparent;padding:0 0 10px;margin-bottom:-1px;font:inherit;font-size:var(--fs-body);color:var(--t3);border-bottom:2px solid transparent;
  transition:color .15s var(--ease),border-color .15s var(--ease)}
.tabs button .num{color:var(--t4);margin-left:3px}
.tabs button:hover,.rvx-tabs button:hover{color:var(--t1)}
.tabs button.on,.rvx-tabs button.on{color:var(--t1);font-weight:600;border-bottom-color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.toolbar .seg{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--bd-2);border-radius:6px;background:#fff;color:var(--t4);margin:0}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.search input{border:0;outline:none;background:transparent;font:inherit;font-size:var(--fs-sm);width:180px;color:var(--t1)}

/* ---------- 表格 ---------- */
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--bd)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tbl th{position:sticky;top:var(--nav-h);z-index:4;background:#fff;text-align:left;font-weight:500;color:var(--t3);font-size:var(--fs-meta);padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl th button{border:0;background:none;padding:0;font:inherit;color:inherit}
.tbl th button:hover{color:var(--t1)}
.tbl th[aria-sort="ascending"],.tbl th[aria-sort="descending"]{color:var(--t1)}
.tbl td{padding:10px;border-bottom:1px solid #EEF0F2;vertical-align:middle}
.tbl tbody tr{transition:background .12s var(--ease)}
.tbl tbody tr:hover td{background:#FAFBFC}
.tbl tbody tr[aria-expanded]{cursor:pointer}
.tbl tr.is-open td{background:var(--bg-2)}
.tbl td.co b{font-weight:600}
.tbl td.act,.tbl th.act{text-align:right;white-space:nowrap}
.tbl td.act .btn{margin-left:4px}
.tbl tr.detail>td{background:var(--bg-2);padding:4px 16px 18px}
.tbl tr.detail:hover>td{background:var(--bg-2)}
.empty-cell{text-align:center;color:var(--t3);padding:28px 10px}
.st{font-size:var(--fs-sm);color:var(--t3);white-space:nowrap}
.st-on{color:var(--ok)}.st-warn{color:var(--warn)}.st-busy{color:var(--acc)}
.score{display:inline-block;min-width:30px;text-align:right;font-weight:600;color:var(--t3)}
.score.hi{color:var(--ok)}.score.mid{color:var(--t1)}
.add-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;font-size:var(--fs-sm);color:var(--t3)}
.add-row .inp{width:auto;flex:1;min-width:150px;height:32px;padding:0 10px}
/* 公司详情（行内展开） */
.dt{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-top:10px}
.dt-main{min-width:0}
.dt-side h3{font-size:var(--fs-sm);font-weight:600;margin:10px 0 2px}
.dt-side p{font-size:var(--fs-sm);color:var(--t2);line-height:1.7}
.dt-foot{grid-column:1/-1;border-top:1px solid var(--bd);padding-top:8px}
.tbl-in{background:#fff;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.tbl-in th{position:static;background:#fff}
.tbl-in td{padding:8px 10px}
.fix{margin-top:12px}.fix>div{display:flex;gap:8px}.fix .inp{height:32px;padding:0 10px}

/* ---------- 今天 ---------- */
.td{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:48px;align-items:start}
.todo{list-style:none;margin:0;padding:0;border-top:1px solid var(--bd)}
.todo li{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid #EEF0F2}
.todo li>div{flex:1;min-width:0}
.todo b{display:block;font-weight:500;font-size:var(--fs-body)}
.todo span{font-size:var(--fs-sm);color:var(--t3)}
.todo li.is-lead b{font-weight:600;font-size:15px}
.todo-tag{font-size:var(--fs-meta)!important;color:var(--acc)!important;font-weight:600;white-space:nowrap}
.td-chart{position:relative}
.td-chart svg{display:block;width:100%;height:auto;overflow:visible}
.td-chart .bar{fill:var(--acc)}
.td-chart .base{fill:var(--bd-2)}
.td-chart .hit{fill:transparent}
.td-chart .hit:hover+rect{opacity:.75}
.td-chart .lab{font-size:13px;fill:var(--t2);font-variant-numeric:tabular-nums}
.td-chart .ax{font-size:13px;fill:var(--t4)}
.qz-tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
.qz-tip.on{opacity:1}
.td-side .sec-h{margin-top:28px}.td-side .sec-h:first-child{margin-top:0}
.kv{margin:0;border-top:1px solid var(--bd)}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid #EEF0F2;font-size:var(--fs-sm);cursor:pointer}
.kv>div:hover dt{color:var(--t1)}
.kv dt{color:var(--t2);font-weight:400}.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.dl-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--bd)}
.dl-list li{display:grid;grid-template-columns:44px minmax(0,auto) 1fr;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px solid #EEF0F2;font-size:var(--fs-sm);cursor:pointer}
.dl-list b{font-weight:500}.dl-list em{font-style:normal;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-list .num{text-align:left;color:var(--warn);font-weight:600}
#v-dash>*:not(#qzToday){margin-top:40px}

/* ---------- 自动投递 ---------- */
.jobs{list-style:none;margin:0;padding:0;border-top:1px solid var(--bd)}
.job{display:flex;gap:20px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #EEF0F2}
.job-main{flex:1;min-width:0}
.job-t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.job-t b{font-weight:600}
.job-f{font-size:var(--fs-sm);margin-top:2px}
.job-n{font-size:var(--fs-sm);color:var(--warn);margin-top:4px;line-height:1.6}
.job-n.muted{color:var(--t3)}
.job-d{margin-top:6px;font-size:var(--fs-sm)}
.job-d summary{color:var(--acc)}
.job-d p{background:var(--bg-2);border-radius:6px;padding:8px 10px;margin:6px 0;line-height:1.7;white-space:pre-wrap}
.job-a{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:52%}
.list-foot{padding-top:10px}
.log{border-top:1px solid var(--bd);max-height:560px;overflow:auto}
.apx-log{display:grid;grid-template-columns:64px 1fr;gap:8px;font-size:var(--fs-sm);padding:6px 0;border-bottom:1px solid #EEF0F2}
.apx-log span{color:var(--t4);font-variant-numeric:tabular-nums}
.apx-log.ok div{color:var(--ok)}.apx-log.warn div{color:var(--warn)}.apx-log.err div{color:var(--bad)}.apx-log.head div{font-weight:600}
.apx-run i,.rd-st.busy i{animation:none}
.apx-set .rvx-switch{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:var(--fs-sm);line-height:1.6}
.apx-fs{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:center;font-size:var(--fs-sm)}
.apx-src{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #EEF0F2}
.apx-src a{display:block;font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.apx-add{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.apx-add #apSrcUrl,.apx-add button{grid-column:1/-1}
.apx-pre{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* ---------- AI 顾问 ---------- */
.agt{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding:6px 2px}
.agt-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--bd)}
.agt-list li{padding:10px 10px;border-bottom:1px solid #EEF0F2;border-radius:0;transition:background .12s var(--ease)}
.agt-list li:hover{background:var(--bg-2)}
.agt-list li.on{background:var(--bg-3)}
.agt-list b{display:block;font-size:var(--fs-body);font-weight:500}
.agt-list li.on b{font-weight:600}
.agt-list span{display:block;font-size:12.5px;color:var(--t3);line-height:1.5;margin-top:1px}
.agt-form{display:flex;flex-direction:column;gap:8px;max-width:560px}
.agt-form h2{font-size:var(--fs-h1);font-weight:600}
.agt-form>p.muted{margin:-4px 0 8px}
.agt-form label{margin:6px 0 -2px}
.agt-form select.inp,.agt-form textarea.inp{width:100%;padding:8px 10px}
.agt-go{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:var(--fs-sm)}
.agx-side .card{border:0;border-top:1px solid var(--bd);border-radius:0;padding:14px 0}
.agx-main.card{border:1px solid var(--bd)}

/* ---------- 旧组件统一 ---------- */
.kanban .col{background:var(--bg-2);border-radius:var(--r)}
.jcard{border:1px solid var(--bd);border-left:1px solid var(--bd);box-shadow:none;border-radius:6px}
.jcard:hover{border-color:#BFC3CA;box-shadow:none;transform:none}
.kanban{padding:2px 2px 12px}
th{background:#fff;font-weight:500}
.rvx-meter i,.progressbar i{transition:none!important}
.rvx-note,.rvx-p{color:var(--t2)}
.modal{border-radius:10px;box-shadow:0 20px 48px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.06)}
.mask{background:rgba(21,24,29,.36)}
.mhead h3{font-size:16px;font-weight:600}
.toast{background:var(--ink);border-radius:6px;font-size:var(--fs-sm);box-shadow:0 8px 24px rgba(16,24,40,.2)}
blockquote,.qa .ablock .body{border-left-width:1px}

/* ---------- ⌘K ---------- */
.qz-cmd{position:fixed;inset:0;z-index:300;background:rgba(21,24,29,.28);display:none;align-items:flex-start;justify-content:center;padding-top:14vh}
.qz-cmd.on{display:flex}
.qz-cmd-box{width:600px;max-width:calc(100vw - 32px);background:#fff;border-radius:10px;box-shadow:0 24px 56px rgba(16,24,40,.22),0 2px 6px rgba(16,24,40,.06);overflow:hidden}
.qz-cmd-in{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--bd)}
.qz-cmd-in .qi{color:var(--t4)}
.qz-cmd-in input{flex:1;border:0;outline:none;height:48px;font:inherit;font-size:15px;background:transparent}
.qz-cmd-list{max-height:52vh;overflow-y:auto;padding:6px}
.qz-cmd-g{font-size:var(--fs-meta);font-weight:500;color:var(--t4);padding:10px 10px 4px}
.qz-cmd-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:var(--fs-body)}
.qz-cmd-it .qi{color:var(--t4)}
.qz-cmd-it span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qz-cmd-it small{color:var(--t4);font-size:var(--fs-meta);white-space:nowrap}
.qz-cmd-it.on{background:var(--bg-2)}
.qz-cmd-it.on .qi{color:var(--acc)}
.qz-cmd-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--bd);font-size:var(--fs-meta);color:var(--t4)}
.qz-empty{padding:14px;color:var(--t3);font-size:var(--fs-sm)}

@media (max-width:1100px){.td{grid-template-columns:1fr;gap:36px}.dt{grid-template-columns:1fr}}
@media (max-width:860px){
  body{font-size:15px}
  .nav{position:sticky;top:0;bottom:auto;width:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--bd);overflow:visible}
  .brand{padding:0}.brand .qz-bn{display:none}
  .navlinks{flex-direction:row;overflow-x:auto;gap:2px}
  .navlinks button{width:auto;padding:7px 10px}.navlinks button span{overflow:visible}

  .wrap{margin-left:0;padding:0 16px 80px}
  .qz-top{top:53px;margin:0 -16px 20px;padding:0 16px}
  .qz-search{width:auto;max-width:none}.qz-search span,.qz-search kbd{display:none}
  .tbl th{top:105px}
  .agt{grid-template-columns:1fr}
  .job{flex-direction:column;gap:10px}.job-a{max-width:none;justify-content:flex-start}
  .search input{width:120px}
  .apx-fs{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

h2.h5,h3.h5{font-size:12.5px;font-weight:600;color:var(--acc);margin-bottom:6px}
.agx-prov button i{color:var(--t3)}
.kanban{padding:2px 12px 12px}
.followups li,[style*="border-left:1px solid"]{border-radius:6px}
#revAnalysis .btn{height:auto;min-height:28px;padding-top:4px;padding-bottom:4px}
/* 表格在可横向滚动的容器里时，表头不吸顶（否则会盖住第一行） */
.tbl-wrap th,.tbl-in th{position:static}
.td-chart svg,.td-chart text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
/* 概览下方与「今天」重复的旧区块 */
#v-dash .grid:has(#dash-funnel),#dashHome .card:has(.rvx-funnel){display:none}
@media (max-width:860px){
  .hide-sm{display:none}
  .tbl td,.tbl th{padding:10px 6px}
  .toolbar .search{flex:1}.search input{width:100%}
  .pg-h{align-items:flex-start}
  .dt{padding-top:6px}.fix>div{flex-direction:column}
}

/* ---------- 我的经历 ---------- */
.cv-sec{margin-top:36px}
.cv-sec .sec-row{margin-top:0;border-bottom:1px solid var(--bd);padding-bottom:2px;margin-bottom:0}
.cv-sec .sec-h .muted{font-weight:400;margin-left:4px}
.cv-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px;margin:0}
.cv-kv>div{display:grid;grid-template-columns:128px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid #EEF0F2;font-size:var(--fs-sm)}
.cv-kv dt{color:var(--t3);font-weight:400}
.cv-kv dd{margin:0;color:var(--t1);overflow-wrap:anywhere}
.cv-kv.cv-wide{grid-template-columns:1fr}
.cv-kv.cv-wide>div{grid-template-columns:160px minmax(0,1fr)}
.cv-kv.cv-wide dd{line-height:1.7;max-width:80ch}
.cv-list{list-style:none;margin:0;padding:0}
.cv-list>li{padding:16px 0;border-bottom:1px solid #EEF0F2}
.cv-list.cv-compact>li{padding:9px 0}
.cv-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cv-row b{font-weight:600;font-size:15px}
.cv-row span{color:var(--t2)}
.cv-row em{font-style:normal;color:var(--t3);font-size:var(--fs-sm);margin-left:auto}
.cv-row .btn{margin-left:4px;align-self:center}
.cv-list>li>p{margin-top:6px;font-size:var(--fs-sm);color:var(--t2);line-height:1.7}
.cv-h{font-weight:600;color:var(--t1);margin-right:8px}
.cv-bullets{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:92ch}
.cv-bullets li p{font-size:var(--fs-body);line-height:1.7;color:var(--t2);padding-left:14px;position:relative}
.cv-bullets li p::before{content:"";position:absolute;left:2px;top:.72em;width:4px;height:4px;border-radius:50%;background:var(--t4)}
.cv-bullets small{display:block;padding-left:14px;font-size:12px;color:var(--t3)}
.cv-check{display:flex;gap:8px;align-items:baseline;margin-top:6px;font-size:var(--fs-sm);color:var(--warn)}
.cv-check b{font-weight:600;white-space:nowrap}
.cv-foot{margin-top:28px}
/* 编辑表单：原地展开 */
.cv-list>li.is-edit{padding:18px 20px;margin:8px -20px;background:var(--bg-2);border-radius:var(--r);border-bottom:0}
.cv-form{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.cv-form label{display:flex;flex-direction:column;gap:5px;font-size:var(--fs-meta);color:var(--t3);font-weight:500;margin:0}
.cv-form .inp{height:34px;padding:0 10px;font-size:var(--fs-body)}
.cv-form textarea.inp{height:auto;padding:8px 10px;line-height:1.7;resize:vertical}
.cv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.cv-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 16px;align-items:end}
.cv-grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px 16px}
.cv-bf{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.cv-bf legend{font-size:var(--fs-sm);font-weight:600;color:var(--t1);padding:0;margin-bottom:8px}
.cv-b{display:flex;flex-direction:column;gap:10px;padding:14px;background:#fff;border:1px solid var(--bd);border-radius:6px}
.cv-bact{display:flex;gap:4px;justify-content:flex-end}
.cv-fact{display:flex;gap:8px;align-items:center;border-top:1px solid var(--bd);padding-top:12px}
.cv-fact span{flex:1}
.btn.danger{color:var(--bad)}
@media (max-width:860px){
  .cv-kv{grid-template-columns:1fr}.cv-kv>div,.cv-kv.cv-wide>div{grid-template-columns:96px minmax(0,1fr)}
  .cv-grid,.cv-grid2,.cv-grid3{grid-template-columns:1fr}
  .cv-row em{margin-left:0;width:100%}
  .cv-list>li.is-edit{margin:8px -16px;padding:16px}
}

/* ---------- 面试：素材库 / 答案库 / 复盘 / Mock（扁平、中性标签、颜色只留给警示） ---------- */
.ablock{margin-top:16px}
.ablock h5,.ablock .h5,h2.h5,h3.h5{font-size:var(--fs-meta);font-weight:600;color:var(--t3);margin:0 0 4px;letter-spacing:0}
.ablock .body{background:none;border:0;padding:0;color:var(--t2);font-size:var(--fs-body);line-height:1.8;white-space:pre-wrap;max-width:80ch}
.ablock .body.is-no{color:var(--bad)}
.ablock .body.is-trap{color:var(--t1);background:var(--warn-bg);padding:8px 10px;border-radius:6px}
.followups{list-style:none;margin:0;padding:0}
.followups li{background:none;border:0;padding:3px 0 3px 14px;position:relative;color:var(--t2)}
.followups li::before{content:"";position:absolute;left:2px;top:.8em;width:4px;height:4px;border-radius:50%;background:var(--t4)}
/* 素材库 */
.st-sum{font-size:var(--fs-sm);color:var(--t3);margin:0}
.st-sum b{color:var(--warn);font-weight:600}
#starFilters{margin:0 0 8px}
#starList{border-top:1px solid var(--bd)}
.st{padding:24px 0 26px;border-bottom:1px solid var(--bd)}
.st-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.st-h h2{font-size:16px;font-weight:600}
.st-h p{font-size:var(--fs-sm);color:var(--t3);margin-top:2px}
.st-state{font-size:var(--fs-sm);color:var(--t3);white-space:nowrap}
.st-state.ok{color:var(--ok)}.st-state.warn{color:var(--warn);font-weight:600}
.st-line{margin-top:12px;font-size:15px;font-weight:500;color:var(--t1);line-height:1.7;max-width:72ch}
.st-tabs{display:flex;gap:18px;border-bottom:1px solid var(--bd);margin:16px 0 14px;flex-wrap:wrap}
.st-tabs button{border:0;background:none;padding:0 0 8px;margin-bottom:-1px;font:inherit;font-size:var(--fs-sm);color:var(--t3);border-bottom:2px solid transparent}
.st-tabs button:hover{color:var(--t1)}
.st-tabs button.on{color:var(--t1);font-weight:600;border-bottom-color:var(--ink)}
.st-tabs .num{color:var(--t4)}
.st-text{font-size:var(--fs-body);line-height:1.85;color:var(--t2);max-width:80ch;white-space:normal}
.st-risk{color:var(--bad)}
.st-qa,.st-star,.st-meta{margin:0}
.st-qa>div{padding:10px 0;border-bottom:1px solid #EEF0F2}
.st-qa>div:first-child{padding-top:0}
.st-qa dt{font-weight:600;color:var(--t1);font-size:var(--fs-body)}
.st-qa dd{margin:4px 0 0;color:var(--t2);line-height:1.8;max-width:80ch}
.st-star>div,.st-meta>div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:6px 0}
.st-star dt,.st-meta dt{font-size:var(--fs-meta);color:var(--t3);font-weight:500;padding-top:2px}
.st-star dd,.st-meta dd{margin:0;color:var(--t2);line-height:1.8;font-size:var(--fs-body)}
.st-meta{margin-top:14px;padding-top:10px;border-top:1px solid #EEF0F2}
.st-meta dd{font-size:var(--fs-sm)}
.st-audit .ablock:first-child{margin-top:0}
.st-nums{font-size:var(--fs-sm);color:var(--t2);line-height:1.9;margin:0}
#v-star .card{border:0;padding:0;margin-top:28px}
/* 答案库 */
#bankList{border-top:1px solid var(--bd)}
.qa{border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;margin:0;box-shadow:none}
.qa:hover{box-shadow:none;background:#FAFBFC}
.qa>.q{padding:14px 4px}
.qa>.q .txt{font-weight:500;font-size:var(--fs-body)}
.qa>.q .arrow{color:var(--t4);font-size:10px}
.qa-meta{margin-top:4px;font-size:12.5px;color:var(--t3);font-weight:400}
.qa-meta b{color:var(--warn);font-weight:600}
.qa>.a{border-top:0;padding:0 4px 18px}
.qa.open{background:none}
/* 面试复盘 */
.rv-ana{padding:0 0 24px;margin-bottom:24px;border-bottom:1px solid var(--bd)}
.rv-ana .grid{gap:32px}
.rv-ana .muted{font-size:var(--fs-meta)}
.hb{display:grid;grid-template-columns:64px minmax(0,1fr) 30px;align-items:center;gap:10px;margin-bottom:8px;font-size:var(--fs-sm)}
.hb i{display:block;height:6px;background:var(--bg-3);border-radius:3px;overflow:hidden}
.hb i b{display:block;height:100%;background:var(--ink);border-radius:3px}
.hb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--t2)}
.hb em.low{color:var(--bad);font-weight:600}
#revList .card,#reviewList .card,#v-reviews .card.pad{border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:20px 0;margin:0!important}
.rv-meta{margin-top:4px;font-size:var(--fs-sm);color:var(--t3)}
.rv-meta b.ok{color:var(--ok)}.rv-meta b.bad{color:var(--bad)}
.rv-dim{font-size:var(--fs-sm);color:var(--t2);margin-right:14px}
.rv-dim.low b{color:var(--bad)}
.rq{padding:10px 0;border-bottom:1px solid #EEF0F2}
.rq-q{font-weight:500;color:var(--t1)}
.rq-m{margin-left:10px;font-size:var(--fs-meta);color:var(--t3);font-weight:400}
.rq-m b{font-weight:600;color:var(--t2)}.rq-m b.bad{color:var(--bad)}
.rq-fail{margin-top:4px;font-size:var(--fs-sm);color:var(--bad)}
.rq-act{margin-top:6px}
/* Mock */
#v-mock .card{box-shadow:none}
.qbox{border:1px solid var(--bd);box-shadow:none;border-radius:var(--r)}
.qtext{font-size:20px;font-weight:600}
.timer{color:var(--t1)}
.rate button.on{background:var(--ink);border-color:var(--ink)}
.searchbox::before{content:none}
.searchbox input{border-radius:6px;padding:8px 12px;border-color:var(--bd-2);font-size:var(--fs-sm)}
.searchbox input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.filters .chip{border-radius:6px}
/* 今天：旧的能力雷达 / 失败模式已并入「面试复盘」 */
#v-dash .grid:has(#dash-radar),#v-dash .grid:has(#dash-todo),#dash-focus:empty{display:none}
.kv-note{font-size:12.5px;color:var(--t3);margin-top:8px;line-height:1.6}

/* 求职方向 */
.dir-pick{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 16px;font-size:13px}
.dir-pick>span{color:var(--muted);margin-right:4px}
.dir-pick label{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink2,var(--ink));background:var(--bg)}
.dir-pick label.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.dir-pick input{accent-color:var(--accent,#2150D6);margin:0}
.dir-pick label:focus-within{outline:2px solid var(--accent,#2150D6);outline-offset:2px}
.dir-checks{margin:0 0 28px}
.dir-checks article{padding:18px 0;border-top:1px solid var(--line)}
.dir-checks h2{font-size:17px;margin:0 0 4px}
.dir-checks h3{font-size:13px;margin:14px 0 6px;color:var(--muted);font-weight:600}
.dir-checks .cv-kv{margin-top:10px}
.dir-list{list-style:none;margin:0;padding:0}
.dir-list li{padding:6px 0;font-size:14px;line-height:1.55}
.dir-list label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.dir-list input{margin-top:4px;accent-color:var(--accent,#2150D6)}
/* 长文本：限制行宽、允许在任意中文 / 长 URL 处换行 */
.cv-list ul,.cv-list>li>p{max-width:72ch}
.st-line,.st-star dd,.st-meta dd,.st-text{overflow-wrap:anywhere;word-break:break-word;min-width:0}
.st-audit .ablock{padding-top:6px;padding-bottom:6px}

/* AI 顾问：设置区扁平化，对话气泡去掉品牌蓝 */
.agx-set{border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:18px 22px 20px;background:var(--bg-2);display:flex;flex-direction:column;gap:6px}
.agx-set h2{font-size:15px;font-weight:600;margin:0;display:flex;gap:10px;align-items:baseline}
.agx-set h2 .muted{font-size:12.5px;font-weight:400}
.agx-set label{margin-top:8px;font-size:13px;font-weight:500;color:var(--t2)}
.agx-set .rvx-note{margin:0!important;max-width:72ch}
.agx-set>.btn{align-self:flex-start;margin-top:10px}
.agx-main.card{border-radius:8px;box-shadow:none}
.agx-u{background:var(--t1);color:#fff;border-radius:10px}
.agx-a{background:var(--bg-2);border-radius:10px}
.agx-card{border-left:1px solid var(--bd);border-radius:8px}
.pg-act>label.btn,.pg-act>.btn{margin:0}

/* ---------- 投递进度 ---------- */
#v-apps>.filters,#v-apps #kanbanWrap,#v-apps #listWrap{display:none}
.ap-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--bd);margin:4px 0 10px}
.ap-bar i{display:block;min-width:6px}
.b-wish{background:#C9CDD3}.b-sent{background:#8FA8EA}.b-intv{background:#2150D6}.b-offer{background:#177245}.b-fail{background:#D8A7A1}
.ap-legend{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;margin:0 0 20px;padding:0;font-size:12.5px;color:var(--t3)}
.ap-legend li{display:flex;align-items:center;gap:6px}
.ap-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ap-legend b{color:var(--t1);font-weight:600}
.ap-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px}
.ap-tools .search{flex:1;min-width:180px;max-width:280px}
.ap-views{margin-left:auto;border:0}
.ap-note{margin:-6px 0 14px}
.ap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ap-card{display:flex;flex-direction:column;gap:12px;border:1px solid var(--bd);border-radius:8px;background:#fff;padding:16px 16px 14px;min-width:0}
.ap-card>header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ap-card h3{font-size:15px;font-weight:600;margin:0;line-height:1.4}
.ap-card header p{margin:2px 0 0;font-size:13px;color:var(--t2);line-height:1.5;overflow-wrap:anywhere}
.ap-card.is-fail,.ap-card.is-quit{background:#FAFAFB}
.ap-card.is-fail h3,.ap-card.is-quit h3{color:var(--t2)}
.ap-card>footer{margin-top:auto;padding-top:10px;border-top:1px solid var(--bd)}
.ap-steps{display:grid;grid-template-columns:repeat(7,1fr);list-style:none;margin:0;padding:0;counter-reset:s}
.ap-steps li{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--t3);min-width:0}
.ap-steps li::before{content:"";position:absolute;top:5px;left:-50%;right:50%;height:2px;background:var(--bd)}
.ap-steps li:first-child::before{display:none}
.ap-steps li i{position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #C9CDD3;box-sizing:border-box}
.ap-steps li span{white-space:nowrap}
.ap-steps li.done i{background:var(--t1);border-color:var(--t1)}
.ap-steps li.done::before,.ap-steps li.cur::before{background:var(--t1)}
.ap-steps li.done span{color:var(--t2)}
.ap-steps li.cur i{border-color:#2150D6;background:#EAF0FD;box-shadow:0 0 0 3px #EAF0FD}
.ap-steps li.cur span{color:#2150D6;font-weight:600}
.ap-steps li.fail i{border-color:#B42318;background:#B42318}
.ap-steps li.fail span{color:#B42318;font-weight:600}
.ap-now{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:32px}
.ap-cur{font-size:13px;font-weight:500;color:var(--t1)}
.ap-seg button.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.ap-seg button.is-bad.on{background:#B42318;border-color:#B42318;color:#fff}
.ap-badge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:600;background:#F4F5F7;color:var(--t2)}
.ap-badge.ok{background:#E7F4EC;color:#177245}
.ap-badge.bad{background:#FBEAE8;color:#B42318}
.ap-now .ap-badge+.btn{margin-left:auto}
.ap-meta{margin:0;font-size:12.5px;color:var(--t3);line-height:1.6}
.ap-due{color:#8F5200;font-weight:600}
.ap-cvchip{display:inline-flex;align-items:center;max-width:100%;min-height:28px;padding:2px 10px;border:1px solid var(--bd-2,#D3D6DB);border-radius:6px;background:#fff;font:inherit;font-size:12.5px;color:var(--t1);cursor:pointer;text-align:left;overflow-wrap:anywhere}
.ap-cvchip:hover{border-color:var(--t1)}
.ap-cvchip.is-empty{border-style:dashed;color:var(--t2)}
.ap-tbl td{vertical-align:middle}
.ap-tbl .inp.sm{height:30px;padding:0 8px;font-size:13px;min-width:110px}
.ap-tbl .seg button{height:28px;padding:0 10px}
.ap-tbl tr.is-fail td,.ap-tbl tr.is-quit td{color:var(--t3)}
.ap-feed{list-style:none;margin:0;padding:0}
.ap-feed li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.ap-feed time{color:var(--t3);font-variant-numeric:tabular-nums}
.ap-kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 14px}
.ap-kv dt{font-size:12px;color:var(--t3)}.ap-kv dd{margin:2px 0 0;font-size:13.5px;overflow-wrap:anywhere}
.ap-cv{white-space:pre-wrap;font:13px/1.75 inherit;font-family:inherit;background:#F4F5F7;border-radius:8px;padding:14px 16px;max-height:52vh;overflow:auto;margin:0}
@media (max-width:640px){.ap-grid{grid-template-columns:1fr}.ap-views{margin-left:0}.ap-kv{grid-template-columns:1fr}.ap-steps li span{font-size:10.5px}}

/* ---------- Mock 评分 ---------- */
.mk-opts{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.mk-opts button{display:flex;gap:12px;align-items:center;text-align:left;min-height:44px;padding:8px 14px;border:1px solid var(--bd-2,#D3D6DB);border-radius:6px;background:#fff;font:inherit;font-size:14px;color:var(--t1);cursor:pointer}
.mk-opts button b{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--bd-2,#D3D6DB);font-size:12px;flex:none}
.mk-opts button:hover{border-color:var(--t1)}
.mk-opts button.on{border-color:#2150D6;background:#EAF0FD}
.mk-opts button.on b{background:#2150D6;border-color:#2150D6;color:#fff}
.mk-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:16px 0 18px;border-bottom:1px solid var(--bd);margin-bottom:8px}
.mk-sum>div{display:flex;align-items:baseline;gap:10px}
.mk-sum b{font-size:32px;font-weight:600;line-height:1}
.mk-sum p{margin:0;max-width:72ch}
.mk-items{list-style:none;margin:0;padding:0}
.mk-items>li{padding:20px 0;border-bottom:1px solid var(--bd)}
.mk-items h3{font-size:15px;font-weight:600;margin:0 0 8px;line-height:1.6}
.mk-ev{margin-top:12px;font-size:13.5px;line-height:1.75;color:var(--t2)}
.mk-ev p{margin:4px 0;max-width:80ch}
.mk-ev-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mk-ev-h b{font-size:20px;color:var(--t1)}
.mk-miss b{color:#B42318}
.mk-dims{list-style:none;margin:8px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 20px;max-width:720px}
.mk-dims li{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:8px;font-size:12.5px}
.mk-dims i{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;display:block}
.mk-dims i b{display:block;height:100%;background:var(--t1)}
.mk-dims em{font-style:normal;color:var(--t3);text-align:right}
.mk-items details{margin-top:8px;font-size:13px;color:var(--t2)}
.mk-items summary{cursor:pointer;color:var(--t3)}
.mk-items details ol{margin:6px 0 0;padding-left:20px}
.ap-badge.warn{background:#FDF3E1;color:#8F5200}
.rd-city{max-width:220px;min-width:80px}

/* ---------- 我的经历：简历写法 + 深挖 ---------- */
.cv-warn{color:#8F5200;font-weight:600}

.cv-st.ok{background:#E7F4EC;color:#177245}
.cv-todo{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:10px 0 4px;padding:12px 14px;border-radius:8px;background:#FDF8EE;border:1px solid #F1E2C4}

.cv-todo ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--t1);max-width:80ch}

.cv-tabs{margin:12px 0 0;align-items:center}

.cv-body{padding:14px 0 4px}
.cv-line{font-size:15px;font-weight:600;color:var(--t1);line-height:1.7;margin:0 0 12px;max-width:72ch}
.cv-sub{font-size:12.5px;font-weight:600;color:var(--t3);margin:14px 0 6px}

.cv-long{font-size:14px;line-height:1.85;color:var(--t2);max-width:72ch;white-space:normal}

.cv-src{margin-top:10px;font-size:12px}
.cv-qa{margin:0}
.cv-qa>div{padding:10px 0;border-bottom:1px solid var(--bd)}
.cv-qa dt{font-weight:600;font-size:14px;color:var(--t1);margin-bottom:4px}

/* ---------- 档案切换 ---------- */
.qz-prof{position:relative;margin:6px 0 10px}
.qz-prof-btn{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:#fff;font:inherit;font-size:13px;color:var(--t1);cursor:pointer;text-align:left}
.qz-prof-btn:hover{border-color:var(--bd-2,#D3D6DB)}
.qz-prof-btn .qi{margin-left:auto;color:var(--t3)}
