/* =========================================================================
   投递进度（两个版本共用，替换原来的横向看板 / 时间线）
   · 一个岗位 = 一条投递档案：阶段、这一轮的结果（待定 / 通过 / 未通过）、投递用的简历、复盘
   · 三种视图：卡片（自动换行，不横向滚动）、表格、动态
   · 投递时把当时的简历冻结一份存进档案（a.resumeSnap），之后怎么改简历都不影响这份
   ========================================================================= */
const AP_FLOW=["已投递","笔试/测评","一面","二面","三面/交叉面","HR面","已发offer"];
const AP_STEP={"已投递":"投递","笔试/测评":"笔试","一面":"一面","二面":"二面","三面/交叉面":"三面","HR面":"HR 面","已发offer":"Offer"};
let APV={view:"card",f:"active",q:""};
try{ const v=localStorage.getItem("qz_apps_view"); if(v) APV.view=v; }catch(e){}

function apPast(a){ return a.phase==="实习期"||(!a.phase&&a.date&&a.date<"2026"); }
/* 这条投递现在处于什么结果：wish 想投 · active 进行中 · offer · fail 未通过 · quit 放弃 */
function apOutcome(a){
  if(a.stage==="已发offer"||a.result==="offer") return "offer";
  if(a.result==="放弃") return "quit";
  if(a.result==="挂"||a.stage==="已结束") return "fail";
  if(!a.stage||a.stage==="想投/收藏") return "wish";
  return "active";
}
function apCurStatus(a){ return a.st||"pending"; }   // 当前这一轮：pending 待定 · pass 通过 · fail 未通过
function apLastAt(a){ const h=a.hist||[]; return (h.length?h[h.length-1].at:"")||a.date||""; }

/* ---------- 冻结投递用的简历 ---------- */
function qzFreezeResume(a,h){
  if(!a||!h||!h.model) return;
  if(a.resumeSnap&&a.resumeSnap.id===h.id) return;
  a.resumeHist=h.id; a.resumeFile=h.file+".docx";
  a.resumeSnap={id:h.id,at:new Date().toISOString(),file:h.file,company:h.company,role:h.role,model:JSON.parse(JSON.stringify(h.model))};
  try{ a.resumeText=rvModelText(rvHistModel(h)); }catch(e){}
}
function apSnapModel(a){
  const s=a.resumeSnap; if(!s) return null;
  const m=JSON.parse(JSON.stringify(s.model)); try{ m.photo=m.photo&&rvPhoto()?rvPhoto():""; }catch(e){}
  return m;
}
function apResumeOpen(id){
  const a=S.apps.find(x=>x.id===id); if(!a) return;
  const h=(S.resumeHist||[]).find(x=>x.id===a.resumeHist);
  if(!a.resumeSnap&&h&&a.stage!=="想投/收藏") { qzFreezeResume(a,h); save(); }
  const s=a.resumeSnap, m=s?apSnapModel(a):(h?rvHistModel(h):null);
  if(!m){ return toast("这条投递还没有绑定简历"); }
  const text=(()=>{ try{ return rvModelText(m); }catch(e){ return a.resumeText||""; } })();
  const changed=s&&h&&JSON.stringify(h.model)!==JSON.stringify(s.model);
  openModal(`投递用的简历 · ${esc(a.company)}`,
    `<dl class="ap-kv"><div><dt>文件</dt><dd>${esc((s||h).file)}.docx</dd></div>
      <div><dt>${s?"投递时冻结":"最近保存"}</dt><dd>${esc(qzTime((s||h).at))}</dd></div>
      <div><dt>对应岗位</dt><dd>${esc((s||h).company)} · ${esc((s||h).role)}</dd></div></dl>
    ${changed?`<p class="notice"><span>简历工作台里这一版后来改过；这里显示的是投递当时的内容。</span></p>`:""}
    ${s?"":`<p class="notice"><span>还没投递，这是目前绑定的版本；标记「已投递」时会自动冻结一份。</span></p>`}
    <pre class="ap-cv">${esc(text)}</pre>`,
    `<button class="btn" onclick="closeModal()">关闭</button>${h?`<button class="btn" onclick="closeModal();go('resume');RVHIST='${h.id}';renderResumeHome()">在简历工作台打开</button>`:""}<button class="btn" onclick="apResumeExport('${a.id}','pdf')">存为 PDF</button><button class="btn pri" onclick="apResumeExport('${a.id}','docx')">导出 Word</button>`,true);
}
function apResumeExport(id,kind){
  const a=S.apps.find(x=>x.id===id); if(!a) return;
  const h=(S.resumeHist||[]).find(x=>x.id===a.resumeHist);
  const m=a.resumeSnap?apSnapModel(a):(h?rvHistModel(h):null), file=(a.resumeSnap||h||{}).file||"简历";
  if(!m) return;
  if(kind==="pdf") rvPrintModel(m,file); else rvDownloadModel(m,file);
}
function apMakeResume(id){ go("resume"); setTimeout(()=>rvOpenApp(id),0); }

/* ---------- 改阶段 / 结果 ---------- */
function apHist(a,stage,st){ a.hist=a.hist||[]; a.hist.push({stage,st,at:new Date().toISOString()}); }
function apSetStatus(id,st){
  const a=S.apps.find(x=>x.id===id); if(!a) return;
  const cur=a.stage;
  if(st!=="pending"&&!AP_FLOW.includes(cur)) return toast("先把阶段改成正在进行的一轮");
  if(st==="pass"){
    apHist(a,cur,"pass");
    const i=AP_FLOW.indexOf(cur), next=AP_FLOW[Math.min(i+1,AP_FLOW.length-1)];
    a.stage=next; a.st="pending"; a.result=next==="已发offer"?"offer":"";
    toast(next==="已发offer"?`${a.company}：拿到 Offer`:`${a.company}：${AP_STEP[cur]||cur} 通过，进入${AP_STEP[next]||next}`);
  }else if(st==="fail"){
    apHist(a,cur,"fail"); a.failAt=cur; a.stage="已结束"; a.result="挂"; a.st="fail";
    toast(`${a.company}：${AP_STEP[cur]||cur} 未通过，已归入「已结束」。记得写复盘`);
  }else{ a.st="pending"; }
  save(); renderApps(); if(typeof renderDash==="function") try{ renderDash(); }catch(e){}
}
function apSetStage(id,stage){
  const a=S.apps.find(x=>x.id===id); if(!a) return;
  const was=a.stage; a.stage=stage; a.st="pending";
  if(stage==="已发offer") a.result="offer"; else if(stage!=="已结束") { a.result=""; a.failAt=""; }
  if(was==="想投/收藏"&&stage!=="想投/收藏"){
    a.date=a.date||qzDay();
    const h=(S.resumeHist||[]).find(x=>x.id===a.resumeHist); if(h) qzFreezeResume(a,h);
  }
  apHist(a,stage,"set"); save(); renderApps();
}
function apReopen(id){ const a=S.apps.find(x=>x.id===id); if(!a) return; a.stage=a.failAt||"已投递"; a.result=""; a.st="pending"; a.failAt=""; save(); renderApps(); }


/* ---------- 导出 Excel ----------
   复用简历导出用的 zip 打包器生成真正的 .xlsx（两个工作表：投递记录、进度时间线），不依赖任何外部库。 */
function apX(v){ return String(v==null?"":v).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,""); }
function apSheet(rows,widths){
  const col=i=>{ let s="",n=i+1; while(n){ s=String.fromCharCode(64+((n-1)%26+1))+s; n=Math.floor((n-1)/26); } return s; };
  const body=rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{
    const num=typeof v==="number"&&isFinite(v);
    return `<c r="${col(ci)}${ri+1}"${ri===0?' s="1"':""}${num?"":' t="inlineStr"'}>${num?`<v>${v}</v>`:`<is><t xml:space="preserve">${apX(v)}</t></is>`}</c>`;
  }).join("")}</row>`).join("");
  return `<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
    <cols>${(widths||[]).map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>
    <sheetData>${body}</sheetData></worksheet>`;
}
function apExport(){
  if(typeof rvZip!=="function") return toast("这个版本不支持导出 Excel");
  const all=(S.apps||[]), stageName=a=>{ const o=apOutcome(a); return o==="offer"?"已拿 Offer":o==="fail"?(a.failAt?`未通过（${AP_STEP[a.failAt]||a.failAt}）`:"未通过"):o==="quit"?"已放弃":o==="wish"?"想投 / 收藏":AP_STEP[a.stage]||a.stage||""; };
  const head=["公司","部门","岗位","城市","渠道","当前阶段","这一轮","投递日期","截止日期","匹配度","投递用简历","复盘数","岗位链接","归类","备注"];
  const rows=[head,...all.map(a=>[a.company||"",a.dept||"",a.role||"",a.city||"",a.channel||"",stageName(a),
    ["active","wish"].includes(apOutcome(a))?({pending:"待定",pass:"通过",fail:"未通过"}[apCurStatus(a)]||""):"",String(a.date||""),String(a.deadline||""),
    a.match?Number(a.match):"",(a.resumeSnap&&a.resumeSnap.file)||a.resumeFile||"",
    (S.reviews||[]).filter(r=>r.appId===a.id).length,a.url||"",apPast(a)?"往期实习":"本季秋招",String(a.note||"").replace(/\s+/g," ").slice(0,300)])];
  const tl=[["日期","公司","岗位","动作","阶段"]];
  all.forEach(a=>(a.hist||[]).forEach(h=>tl.push([String(h.at||"").slice(0,10),a.company||"",a.role||"",{pass:"通过",fail:"未通过",set:"进入"}[h.st]||h.st||"",AP_STEP[h.stage]||h.stage||""])));
  const sheets=[["投递记录",apSheet(rows,[16,16,26,12,10,14,8,12,12,8,26,8,40,10,40])],["进度时间线",apSheet(tl,[12,16,26,10,10])]];
  const files=[
    {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((x,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
    {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((x,i)=>`<sheet name="${apX(x[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((x,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:"xl/styles.xml",data:`<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="1"><fill><patternFill patternType="none"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles><cellXfs count="2"><xf xfId="0"/><xf xfId="0" fontId="1" applyFont="1"/></cellXfs></styleSheet>`},
    ...sheets.map((x,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:x[1]})),
  ];
  const blob=new Blob([rvZip(files)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`投递进度_${qzDay()}.xlsx`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(`已导出 ${all.length} 条投递`);
}

/* ---------- 渲染 ---------- */
function apStepper(a){
  const o=apOutcome(a), at=o==="fail"?(a.failAt||""):a.stage, idx=AP_FLOW.indexOf(at);
  const passed=new Set((a.hist||[]).filter(h=>h.st==="pass").map(h=>h.stage));
  return `<ol class="ap-steps" aria-label="进度">${AP_FLOW.map((s,i)=>{
    let c=""; if(o==="offer") c="done";
    else if(i<idx) c=passed.has(s)||i<idx?"done":"";
    else if(i===idx) c=o==="fail"?"fail":"cur";
    return `<li class="${c}" title="${esc(s)}"><i></i><span>${AP_STEP[s]}</span></li>`; }).join("")}</ol>`;
}
function apStatusCtl(a){
  const o=apOutcome(a);
  if(o==="offer") return `<span class="ap-badge ok">已拿 Offer</span>`;
  if(o==="fail") return `<span class="ap-badge bad">${esc(AP_STEP[a.failAt]||a.failAt||"")}${a.failAt?" ":""}未通过</span><button class="btn sm ghost" onclick="apReopen('${a.id}')">撤销</button>`;
  if(o==="quit") return `<span class="ap-badge">已放弃</span>`;
  if(o==="wish") return `<button class="btn sm" onclick="apSetStage('${a.id}','已投递')">标记已投递</button>`;
  const st=apCurStatus(a), lab=AP_STEP[a.stage]||a.stage;
  return `<div class="seg ap-seg" role="group" aria-label="${esc(lab)}的结果">
    <button class="${st==="pending"?"on":""}" onclick="apSetStatus('${a.id}','pending')">待定</button>
    <button class="${st==="pass"?"on":""}" onclick="apSetStatus('${a.id}','pass')">通过</button>
    <button class="${st==="fail"?"on":""} is-bad" onclick="apSetStatus('${a.id}','fail')">未通过</button></div>`;
}
function apResumeChip(a){
  if(a.resumeSnap) return `<button class="ap-cvchip" onclick="apResumeOpen('${a.id}')" title="投递时冻结的版本，之后改简历不影响">简历：${esc(a.resumeSnap.file)} · ${esc(qzDay(new Date(a.resumeSnap.at)).slice(5))} 冻结</button>`;
  if(a.resumeHist&&(S.resumeHist||[]).some(x=>x.id===a.resumeHist)) return `<button class="ap-cvchip" onclick="apResumeOpen('${a.id}')">简历：已绑定，投递时冻结</button>`;
  return `<button class="ap-cvchip is-empty" onclick="apMakeResume('${a.id}')">${(a.jd||"").length>30?"按 JD 生成简历":"还没有简历 · 去生成"}</button>`;
}
function apMeta(a){
  const bits=[];
  if(a.date&&a.stage!=="想投/收藏") bits.push("投递 "+esc(String(a.date).slice(0,10)));
  if(a.deadline) bits.push(`<span class="${a.stage==="想投/收藏"&&a.deadline<=qzDay(new Date(Date.now()+3*864e5))?"ap-due":""}">截止 ${esc(a.deadline.slice(5))}</span>`);
  if(a.city) bits.push(esc(a.city)); if(a.channel) bits.push(esc(a.channel)); if(a.match) bits.push("匹配 "+esc(a.match));
  const nr=(S.reviews||[]).filter(r=>r.appId===a.id).length; if(nr) bits.push(`<a href="javascript:go('reviews')">复盘 ${nr}</a>`);
  return bits.join(" · ");
}
function apAppCard(a){
  const o=apOutcome(a);
  return `<article class="ap-card is-${o}">
    <header><div><h3>${esc(a.company)}</h3><p>${esc(a.dept?a.dept+" · ":"")}${esc(a.role)}</p></div>
      <button class="btn sm ghost" onclick="openApp('${a.id}')" aria-label="编辑 ${esc(a.company)}">编辑</button></header>
    ${o==="wish"?"":apStepper(a)}
    <div class="ap-now">${o==="active"?`<span class="ap-cur">当前：${esc(AP_STEP[a.stage]||a.stage)}</span>`:""}${apStatusCtl(a)}</div>
    <p class="ap-meta">${apMeta(a)||"&nbsp;"}</p>
    <footer>${apResumeChip(a)}</footer>
  </article>`;
}
function apRow(a){
  const o=apOutcome(a);
  return `<tr class="is-${o}"><td><b>${esc(a.company)}</b><div class="muted">${esc(a.role)}</div></td>
    <td><select class="inp sm" aria-label="阶段" onchange="apSetStage('${a.id}',this.value)">${STAGES.map(s=>`<option ${s===a.stage?"selected":""}>${s}</option>`).join("")}</select></td>
    <td>${apStatusCtl(a)}</td>
    <td class="num hide-sm">${esc(a.date&&a.stage!=="想投/收藏"?String(a.date).slice(5,10):"–")}</td>
    <td class="num hide-sm">${esc(a.deadline?a.deadline.slice(5):"–")}</td>
    <td>${apResumeChip(a)}</td>
    <td class="act"><button class="btn sm ghost" onclick="openApp('${a.id}')">编辑</button></td></tr>`;
}
function apFeed(list){
  const ev=[]; list.forEach(a=>(a.hist||[]).forEach(h=>ev.push({a,h})));
  list.forEach(a=>{ if(!(a.hist||[]).length&&a.date&&a.stage!=="想投/收藏") ev.push({a,h:{stage:"已投递",st:"set",at:String(a.date)}}); });
  ev.sort((x,y)=>String(y.h.at).localeCompare(String(x.h.at)));

const FAIL_MODES = [
 "没给公式/口径","只有结论没有过程","经历讲太平（缺数字）","没落到岗位",
 "被追问击穿","结构混乱","临场卡壳/空白","只说 what 没说 why",
 "没有自己的观点","例子不贴题","超时/太啰嗦","反问乏力",
 "忽略业务约束","数据说不清来源"
];
const RADAR_DIMS = ["业务理解","数据量化","结构表达","岗位匹配","临场应变"];
function allQs(){ const out=[]; (S.reviews||[]).forEach(r=>(r.qs||[]).forEach(q=>out.push({...q, _r:r}))); return out; }
function failStats(){
  const m={}; allQs().forEach(q=>(q.fail||[]).forEach(f=>{ m[f]=m[f]||{n:0,qs:[]}; m[f].n++; m[f].qs.push(q); }));
  (S.mocks||[]).forEach(mk=>(mk.items||[]).forEach(i=>(i.fail||[]).forEach(f=>{ m[f]=m[f]||{n:0,qs:[]}; m[f].n++; })));
  return Object.entries(m).sort((a,b)=>b[1].n-a[1].n);
}
function radarAvg(){
  const sum={}, cnt={};
  (S.reviews||[]).forEach(r=>{ RADAR_DIMS.forEach(d=>{ const v=(r.radar||{})[d]; if(v){ sum[d]=(sum[d]||0)+v; cnt[d]=(cnt[d]||0)+1; } }); });
  return RADAR_DIMS.map(d=>({d, v: cnt[d]? sum[d]/cnt[d] : 0}));
}
function repeatedQs(){
  const norm=s=>String(s).replace(/[\s，。？?、,.:：（）()「」""]/g,"").slice(0,14);
  const m={};
  allQs().forEach(q=>{ const k=norm(q.q); if(!k) return; m[k]=m[k]||{q:q.q,hits:[]}; m[k].hits.push(q); });
  (S.mocks||[]).forEach(mk=>(mk.items||[]).forEach(i=>{ const k=norm(i.q); if(!m[k]) return; m[k].hits.push({...i,_mock:true}); }));
  return Object.values(m).filter(x=>x.hits.length>1).sort((a,b)=>b.hits.length-a.hits.length);
}
function weakQs(){ return allQs().filter(q=>q.score&&q.score<=2); }

{id:"q063",co:"字节跳动",track:"商业分析",round:"一面",type:"业务面",q:"某客户上周消耗 10 万元获得 500 个转化，客单价 200 元；本周消耗 15 万元获得 600 个转化。请分析本周投放表现变好还是变差了？",hint:"先算 CPA：上周 200 元/转化，本周 250 元/转化，CPA 上升 25%。ROI：上周 500×200/10万=1.0，本周 600×200/15万=0.8。所以变差了。但要补充追问：客单价是否变化、是否在放量期（放量必然抬 CPA）、新客占比、竞价环境。",src:"面经-字节商业化26"},
{id:"q064",co:"字节跳动",track:"商业分析",round:"二面",type:"业务面",q:"请谈谈你对抖音电商直播商业化的理解",hint:"人货场 + 流量结构（自然流/付费流/私域）+ 三个核心指标（GPM、ROI、UV 价值）。对比货架电商的差异。",src:"面经-字节商业化26"},
{id:"q065",co:"字节跳动",track:"商业分析",round:"二面",type:"业务面",q:"如果一个 KA 客户的广告消耗连续两周下滑，你会如何做客户留存？",hint:"先归因：是客户预算减少、还是效果变差、还是被竞品分流。分别对应不同动作。别一上来就给折扣。",src:"面经-字节商业化26"},
{id:"q066",co:"字节跳动",track:"商业分析",round:"交叉面",type:"Case",q:"给你一个从来没接触过的新行业（如宠物经济），你怎么快速了解这个行业的商业化机会？",hint:"再叠加商业化视角：谁付钱、为什么付、现在花在哪。",src:"面经-字节商业化26"},
{id:"q067",co:"字节跳动",track:"商业分析",round:"交叉面",type:"Case",q:"客户预算 50 万/月，要在抖音做品牌曝光但不考核转化，你会如何制定投放策略？",hint:"不考核转化不等于不考核。给预算分配和排期。",src:"面经-字节商业化26"},
{id:"q068",co:"字节跳动",track:"商业分析",round:"交叉面",type:"行为面",q:"如果你和一位销售同事在客户策略上有分歧，你会怎么处理？",hint:"",src:"面经-字节商业化26"},
{id:"q069",co:"字节跳动",track:"产品运营",round:"一面",type:"业务面",q:"你平时使用抖音/今日头条吗？你觉得它有什么可以改进的地方？",hint:"给具体场景+具体断点，不要泛泛说「推荐不准」。",src:"面经-字节运营26"},
{id:"q070",co:"字节跳动",track:"产品运营",round:"一面",type:"业务面",q:"如果让你负责提升某款产品的次日留存率，你会怎么做？",hint:"",src:"面经-字节运营26"},
{id:"q072",co:"字节跳动",track:"产品运营",round:"一面",type:"Case",q:"如果给你一个全新的产品（比如效率工具 App），你会如何从 0 到 1 做用户增长？",hint:"先找 PMF 再谈增长：种子用户从哪来 → 验证核心价值 → 找到可复制的获客渠道 → 再规模化。你有华音的真实 0-1 经验。",src:"面经-字节运营26"},
{id:"q073",co:"字节跳动",track:"产品运营",round:"HR面",type:"行为面",q:"你如何看待加班？如果项目紧急需要你连续加班一周，你会怎么处理？",hint:"",src:"面经-字节运营26"},
{id:"q074",co:"字节跳动",track:"产品运营",round:"HR面",type:"行为面",q:"你觉得你做运营最大的优势是什么？最大的不足是什么？",hint:"",src:"面经-字节运营26"},
{id:"q075",co:"字节跳动",track:"产品运营",round:"HR面",type:"行为面",q:"你最近在关注什么互联网产品或行业趋势？",hint:"准备 1 个具体产品 + 1 个趋势判断（AI 从技术驱动转向场景深耕）。要有自己的观点而不是复述新闻。",src:"面经-字节运营26"},
{id:"q080",co:"美团",track:"产品运营",round:"一面",type:"行为面",q:"请做一个简短的自我介绍，并说明你为什么选择业务运营岗位",hint:"",src:"面经-美团运营26"},
{id:"q081",co:"美团",track:"产品运营",round:"一面",type:"业务面",q:"如果你发现某城市的外卖订单量连续两周下滑，你会从哪些维度进行数据分析？",hint:"外卖特有维度：供给侧（商家在线数、骑手运力）、需求侧（UV、下单转化）、天气/季节、竞对补贴、履约时效。",src:"面经-美团运营26"},
{id:"q082",co:"美团",track:"产品运营",round:"一面",type:"行为面",q:"请分享一段你通过优化流程提升效率的经历",hint:"",src:"面经-美团运营26"},
{id:"q083",co:"美团",track:"产品运营",round:"一面",type:"Case",q:"如果美团要进入一个新城市开展外卖业务，你会从哪些方面制定冷启动策略？",hint:"双边市场先解决鸡生蛋：选点（高密度校园/写字楼）→ 供给先行（签约标杆商家）→ 需求侧补贴 → 运力保障 → 单点跑通再复制。用「华音」的冷启动经验（政府 B 带 C、KOL、私域）做类比。",src:"面经-美团运营26"},
{id:"q084",co:"美团",track:"产品运营",round:"一面",type:"业务面",q:"你对「数据驱动运营」如何理解？请结合实例说明",hint:"数据驱动不是看报表，是「先有假设 → 定口径 → 验证 → 决策」。",src:"面经-美团运营26"},
{id:"q085",co:"美团",track:"产品运营",round:"二面",type:"业务面",q:"在资源有限的情况下，用户增长目标和商家增长目标存在冲突，你会如何权衡？",hint:"回到双边市场：短期看哪边是瓶颈就补哪边；长期看单位经济模型。给一个判断依据（边际投入带来的 GMV 增量）而不是和稀泥。",src:"面经-美团运营26"},
{id:"q086",co:"美团",track:"产品运营",round:"二面",type:"行为面",q:"请分享一次你在跨团队协作中推动项目落地的经历",hint:"",src:"面经-美团运营26"},
{id:"q087",co:"美团",track:"产品运营",round:"HR面",type:"行为面",q:"美团强调「以客户为中心」和「长期主义」，你如何理解这两句话在日常工作中的意义？",hint:"别背价值观。给一个你为了长期结果放弃短期数据的具体选择。",src:"面经-美团运营26"},
{id:"q130",co:"通用",track:"通用",round:"HR面",type:"行为面",q:"你为什么选择我们公司而不是竞争对手？",hint:"给一个只有这家成立的理由（独有资产/业务阶段），不要说文化好、平台大。",src:"通用高频"},
{id:"q131",co:"通用",track:"通用",round:"HR面",type:"行为面",q:"你还投了哪些公司？进展如何？",hint:"诚实但有主线：说明你的投递是围绕一个方向的，而不是海投。",src:"通用高频"},
{id:"q133",co:"通用",track:"通用",round:"HR面",type:"行为面",q:"讲一次你失败的经历，你从中学到了什么",hint:"可以讲前几次面试挂掉的复盘（诚恳且真实），或学代会对接失误。重点在「我改了什么机制」。",src:"通用高频"},
{id:"q134",co:"通用",track:"通用",round:"HR面",type:"行为面",q:"你有什么想问我们的？",hint:"",src:"通用高频"},
{id:"q135",co:"通用",track:"通用",round:"二面",type:"行为面",q:"你为什么去英国读研？读完为什么回国就业？",hint:"正面回答：专业选择（Finance with Data Science 是我需要的能力补强）+ 就业市场判断（我的目标行业主战场在国内）。别显得是备胎选择。",src:"通用高频"},
{id:"q136",co:"通用",track:"通用",round:"二面",type:"行为面",q:"你之前面过腾讯几个岗位都没过，你觉得问题出在哪？",hint:"⚠️ 大概率会被问。诚实复盘：业务侧量化口径答得虚（比如 LTV 没给公式）、经历讲得太平铺。然后说你做了什么改进——这题答好反而是加分项。",src:"通用高频"},
{id:"q140",co:"腾讯",track:"产品运营",round:"一面",type:"业务面",q:"广告投放的类型有哪些？你认为各自类型适合的场景是什么？以及对应的优劣势",hint:"两个分类轴：按目标（品牌/效果）+ 按形式（信息流/搜索/开屏/激励），每类给场景+优劣，最后落回腾讯生态。",src:"面经·腾讯广告产品一面（小红书）"},
{id:"q141",co:"腾讯",track:"产品运营",round:"一面",type:"业务面",q:"你认为对于广告分发可以有什么样的策略？",hint:"eCPM 排序公式 → 出价/预估/流量分配/频控四类策略 → 体验约束。",src:"面经·腾讯广告产品一面（小红书）"},
{id:"q142",co:"腾讯",track:"产品运营",round:"一面",type:"业务面",q:"如何在保证用户体验的同时提高广告的占比？",hint:"核心论点：冲突来自「投得不准」而非「投得太多」。四条路径 + 三个护栏指标。",src:"面经·腾讯广告产品一面（小红书）"},
{id:"q143",co:"腾讯",track:"产品运营",round:"一面",type:"业务面",q:"对于商家而言，如何提升广告投放的体验？",hint:"",src:"面经·腾讯广告产品一面（小红书）"},
{id:"q145",co:"腾讯",track:"产品运营",round:"二面",type:"业务面",q:"你觉得效果广告和品牌广告的共同点是什么？",hint:"⚠️ 问的是共同点不是区别，别一上来背区别。先给四个共同点，再补区别做对照。",src:"面经·腾讯广告产运二面（小红书）"},
{id:"q146",co:"腾讯",track:"产品运营",round:"二面",type:"业务面",q:"你对商业分析的价值怎么看？",hint:"商分的价值 = 把模糊的业务判断变成可比较的口径 + 让资源分配有依据。",src:"面经·腾讯广告产运二面（小红书）"},
{id:"q147",co:"腾讯",track:"产品运营",round:"二面",type:"业务面",q:"讲讲你对效果广告的了解",hint:"",src:"面经·腾讯广告产运二面（小红书）"},
{id:"q148",co:"腾讯",track:"产品运营",round:"二面",type:"行为面",q:"你与客户/合作方沟通过程中遇到卡点的经历",hint:"",src:"面经·腾讯广告产运二面（小红书）"},
{id:"q149",co:"腾讯",track:"产品运营",round:"二面",type:"行为面",q:"你对未来三年的规划是什么样的？",hint:"",src:"面经·腾讯广告产运二面（小红书）"},
{id:"q150",co:"腾讯",track:"产品运营",round:"二面",type:"行为面",q:"你觉得你的面试表现怎么样？",hint:"给合理分数 + 一个做得好的点 + 一到两个具体可改进点。",src:"面经·腾讯广告产运二面（小红书）"},
{id:"q152",co:"腾讯",track:"产品经理",round:"群面",type:"行为面",q:"如何评价自己群面的表现？给群面的自己打个分，有什么值得提升的地方？",hint:"这是展现自我反思的机会，别给满分也别自贬。",src:"面经·腾讯（小红书）"},
{id:"q153",co:"腾讯",track:"产品经理",round:"一面",type:"业务面",q:"用 1 分钟的时间向我介绍你做过的一款产品",hint:"⚠️ 限时题，容易被问懵。四件事：核心价值→目标用户→市场定位→你的贡献。",src:"面经·腾讯（小红书）"},
{id:"q154",co:"腾讯",track:"产品经理",round:"一面",type:"业务面",q:"如何理解产品经理这个角色？产品策划最关键的能力是什么？",hint:"面经明确提醒：腾讯面试官是古典产品思路，不要背套话，不要说擅长画原型图。",src:"面经·腾讯（小红书）"},
{id:"q155",co:"腾讯",track:"产品经理",round:"一面",type:"业务面",q:"产品经理为什么要做竞品分析？",hint:"面经里这人说自己答得不好（只说了「了解市场+挖掘空白」）。更好的答法：竞品分析是为了做决策而不是为了了解——三个用途：定差异化方向、做功能优先级参照、预警风险。",src:"面经·腾讯（小红书）"},
{id:"q156",co:"腾讯",track:"产品经理",round:"一面",type:"Case",q:"情景模拟：给你一个生活化场景，如果你是产品经理会怎么回应？",hint:"标准答法是「先分析需求再给方案」——别急着给解法。先问：谁的需求、什么场景下发生、现在他怎么解决的、这个需求是高频还是低频。",src:"面经·腾讯（小红书）"},
{id:"q157",co:"腾讯",track:"产品经理",round:"HR面",type:"行为面",q:"你来腾讯最想提升什么能力？",hint:"给一个具体的、和岗位强相关的能力缺口（比如「在真实量级的数据和用户规模下做决策」），而不是笼统的「学习成长」。",src:"面经·腾讯（小红书）"},
{id:"q170",co:"京东",track:"商业分析",round:"一面",type:"业务面",q:"如何理解零售业？你对电商的理解是什么？",hint:"人货场 + 精准匹配 + 货架场与内容场融合趋势。",src:"京东采销题库（你的 mock 文件夹）"},
{id:"q171",co:"京东",track:"商业分析",round:"一面",type:"业务面",q:"京东 vs 天猫 vs 抖音 vs 拼多多有什么区别？各自优劣势是什么？",hint:"按「主场域 + 业务模式 + 优势 + 短板」四段对比。京东：货架场+自营/POP+供应链时效，短板在非标品丰富度与内容场；阿里：货架场+品牌旗舰；拼多多：极致性价比+拼团裂变+缩短决策路径；抖音：内容场+算法+直播直观，短板在长决策周期品类和退货率。",src:"京东采销题库（你的 mock 文件夹）"},
{id:"q172",co:"京东",track:"商业分析",round:"一面",type:"业务面",q:"给你一个全新的、你没做过的品类/行业，你要如何快速适应和了解？",hint:"和「0 到 1 学电竞」是同一题。找人—找料—找场—拿粗判断去被纠正。再叠加商业视角：谁付钱、为什么付、现在花在哪。",src:"京东采销题库（你的 mock 文件夹）"},
{id:"q173",co:"京东",track:"商业分析",round:"二面",type:"Case",q:"同样的商品，其他平台卖得比我们便宜，你怎么看？怎么处理？",hint:"先拆价差来源（采购成本/补贴/服务成本/品类结构），再判断要不要跟——不是所有价差都要跟。给「跟价的判断标准 + 不跟价时用什么补」。",src:"京东采销题库（你的 mock 文件夹）"},
{id:"q174",co:"京东",track:"商业分析",round:"二面",type:"Case",q:"你的盘子这个月销售额任务 5000 万，你要如何完成？",hint:"拆公式：GMV = 流量 × 转化率 × 客单价，或按品/按渠道/按时间拆。给「盘现状→找差距→排动作→留 buffer」的结构，动作要分确定性高的和搏一把的。",src:"京东采销题库（你的 mock 文件夹）"},
{id:"q176",co:"通用",track:"通用",round:"HR面",type:"行为面",q:"对你影响最深的人是谁？/ 对你影响最深的一句话是什么？",hint:"这类题考价值观。选一个真人 + 一件具体的事 + 它如何改变了你的某个行为习惯。别升华成鸡汤。",src:"京东采销题库（你的 mock 文件夹）"},
{id:"q177",co:"通用",track:"通用",round:"HR面",type:"行为面",q:"你入职后发现这个岗位的工作和你预期不一致，怎么办？",hint:"先分清是「内容不符」还是「预期错误」。给出三步：先做满一个周期再判断→主动和 leader 对齐期望→如果确实错配，说明你会怎么沟通而不是直接走人。",src:"京东采销题库（你的 mock 文件夹）"},
{id:"q178",co:"通用",track:"通用",round:"二面",type:"行为面",q:"如果你和领导或同事产生不同意见和矛盾，如何处理？",hint:"保持冷静→倾听并理解对方立场→找共同目标→基于事实（数据）而非立场寻求方案→事后修复关系。",src:"京东采销题库（你的 mock 文件夹）"},
{id:"q180",co:"字节跳动",track:"商业分析",round:"一面",type:"业务面",q:"怎么理解「生态」？内容生态是怎么运转的？",hint:"生态四特征 → 创作者-内容-平台-用户闭环 → 定性定量指标 → 四类策略抓手。",src:"抖音生态策略运营 JD 拆解（你的文档）"},
{id:"q181",co:"字节跳动",track:"商业分析",round:"一面",type:"业务面",q:"如果让你评估一类内容标准是否合理，你会怎么做？",hint:"定性（找典型 case 人工评审、看审核一致性）+ 定量（覆盖率、误判率、申诉率、对创作者留存和用户消费时长的影响）。标准要能被执行者读懂——沉淀成知识库。",src:"抖音生态策略运营 JD（你的文档）"},

let revPhase="全部";
function renderRevPhaseBar(){
  const box=document.getElementById("revPhaseBar"); if(!box) return;
  const n=p=>p==="全部"?S.reviews.length:S.reviews.filter(r=>(r.phase||"秋招")===p).length;
  box.innerHTML=["全部","秋招","实习期"].map(p=>
    `<div class="chip ${p===revPhase?"on":""}" onclick="revPhase='${p}';renderReviews()">${p} ${n(p)}</div>`).join("")
    +`<span class="muted" style="margin-left:8px">「实习期」是投实习时的面试，不计入本季</span>`;
}

function renderReviewAnalysis(){
  const box=document.getElementById("revAnalysis");
  const qs=allQs(); if(!qs.length){ box.innerHTML=""; return; }
  const fs=failStats(), rep=repeatedQs(), weak=weakQs();
  const byType={}; qs.forEach(q=>{ if(q.score){ const t=q.type||"未分类"; (byType[t]=byType[t]||[]).push(q.score); } });

  box.innerHTML = `
  <section class="rv-ana">
    <h2 class="sec-h">你反复在哪里失分</h2>
    <div class="grid g3">
      <div>
        <div class="muted" style="margin-bottom:8px">能力雷达（跨场平均）</div>
        ${radarAvg().map(({d,v})=>`<div class="hb"><span>${d}</span><i><b style="width:${v/5*100}%"></b></i><em class="${v&&v<3?"low":""}">${v?v.toFixed(1):"–"}</em></div>`).join("")}
      </div>
      <div>
        <div class="muted" style="margin-bottom:8px">失败模式 Top（点击加练）</div>
        ${fs.length? fs.slice(0,6).map(([f,o])=>`<div style="padding:6px 0;border-bottom:1px solid #F4F4F4;display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="font-size:13px">${esc(f)}</span><b class="num">${o.n} 次</b></div>`).join("")
          : '<div class="muted">还没有打过失败模式标签</div>'}
      </div>
      <div>
        <div class="muted" style="margin-bottom:8px">按题型表现</div>
        ${Object.keys(byType).length? Object.entries(byType).map(([t,arr])=>{const a=arr.reduce((x,y)=>x+y,0)/arr.length;
          return `<div class="hb"><span>${t}</span><i><b style="width:${a/5*100}%"></b></i><em class="${a<3?"low":""}">${a.toFixed(1)}</em></div>`;}).join("")
          : '<div class="muted">—</div>'}
      </div>
    </div>
    ${rep.length?`<div class="ablock"><h2 class="h5">跨场重复出现的题（这些是必背题）</h2>
      ${rep.slice(0,6).map(x=>`<div style="padding:7px 0;border-bottom:1px solid #F4F4F4;font-size:13px">
        ${esc(x.q)} <span class="muted">· 出现 ${x.hits.length} 次</span>
        <span class="muted"> · 得分 ${x.hits.filter(h=>h.score).map(h=>h.score+"★").join(" → ")||"未评分"}</span></div>`).join("")}
      <div class="muted" style="margin-top:8px">同一道题分数没有上升，说明上一场的复盘没有真的落地。</div></div>`:""}
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn pri" onclick="drillWeak()">针对弱项开一轮 Mock（${weak.length} 道低分题）</button>
      <button class="btn" onclick="showChecklist()">复盘引导清单</button>
    </div>
  </section>`;
}
function showChecklist(){
  openModal("面完 30 分钟内，按这个填",
  `<div class="ablock"><h2 class="h5">为什么是 30 分钟</h2><div class="body">面试结束后 24 小时，你能回忆起的细节会掉一半以上；而恰恰是细节（面试官在哪一句话上追问、他的表情、他跳过了什么）决定了复盘有没有用。所以先粗填，晚上再补。</div></div>
   <div class="ablock"><h2 class="h5">必填的六件事</h2><div class="body">1. 他问了哪些题？——凭记忆先把题干列出来，答案可以晚点补\n2. 哪一题我卡住了？卡在哪一秒？——卡壳的位置比答错更重要\n3. 他在哪里追问了？追问说明他在意，也说明我第一遍没答透\n4. 他跳过了什么？——跳过意味着他不感兴趣，或者他觉得你答完了\n5. 我有没有把话落回岗位？——大部分人答完就停在自己身上\n6. 反问环节我问了什么？他的回答透露了什么？</div></div>
   <div class="ablock"><h2 class="h5">三个容易被忽略的信号</h2><div class="body">· 面试官开始看表 / 加快节奏 → 通常是已经做完判断了\n· 他开始介绍团队和业务 → 正向信号，他在向你推销\n· 他反复回到同一个话题 → 那是他的关注点，也可能是他的怀疑点</div></div>
   <div class="ablock"><h2 class="h5">最后一步：把结论变成动作</h2><div class="body">复盘不是写感想。每场复盘至少产出一条「下次我会具体怎么做」的动作——比如「凡是问怎么衡量，先给公式再给案例」。没有动作的复盘等于没复盘。</div></div>`);
}
function drillWeak(){
  const weak=weakQs(); if(!weak.length) return toast("还没有低分题，先去复盘里打分");
  const norm=s=>String(s).replace(/[\s，。？?、,.:：（）()「」""]/g,"").slice(0,10);
  const keys=weak.map(q=>norm(q.q));
  const pool=S.questions.filter(q=>keys.some(k=>k&&norm(q.q).includes(k.slice(0,6))));
  const extra=weak.map((w,i)=>({id:"drill-"+i,co:w._r?w._r.company:"复盘",track:"弱项",round:w._r?w._r.round:"一面",
    type:w.type||"业务面",q:w.q,hint:w.fix||"（复盘时没写改进方案，这次自己想）",src:"你的复盘弱项"}));
  const merged=[...extra, ...pool.filter(p=>!extra.some(e=>e.q===p.q))];
  go("mock");
  setTimeout(()=>{ startMockWith(merged.slice(0,12), {co:"弱项加练",track:"低分题",round:"专项"}); },300);
}

/* ===================== Mock 面试 ===================== */
let MK = null, mkTimerId=null;
function uniq(arr){ return [...new Set(arr)]; }
function fillMockSelects(){
  const q=S.questions;
  const set=(id,vals,label)=>{ const el=document.getElementById(id);
    el.innerHTML=`<option value="">全部${label}</option>`+vals.map(v=>`<option>${v}</option>`).join(""); el.onchange=updatePool; };
  set("mkCompany",uniq(q.map(x=>x.co)),"题源");
  set("mkTrack",uniq(q.map(x=>x.track)),"方向");
  set("mkRound",uniq(q.map(x=>x.round)),"轮次");
  document.getElementById("mkType").onchange=updatePool;
  document.getElementById("mkCount").onchange=updatePool;
  updatePool();
}
function poolQs(){
  const co=document.getElementById("mkCompany").value, tr=document.getElementById("mkTrack").value,
        rd=document.getElementById("mkRound").value, ty=document.getElementById("mkType").value;
  return S.questions.filter(q=>(!co||q.co===co)&&(!tr||q.track===tr)&&(!rd||q.round===rd)&&(ty==="all"||q.type===ty));
}
function updatePool(){ document.getElementById("mkPool").textContent = `当前筛选命中 ${poolQs().length} 道题（题库共 ${S.questions.length} 道）`; }
function startMock(){
  let pool=poolQs();
  if(pool.length<2) return toast("题太少了，放宽一下筛选条件");
  const n=Math.min(+document.getElementById("mkCount").value, pool.length);
  pool=[...pool].sort(()=>Math.random()-0.5).slice(0,n);
  startMockWith(pool, {co:document.getElementById("mkCompany").value||"混合",
    track:document.getElementById("mkTrack").value||"全方向", round:document.getElementById("mkRound").value||"全轮次"});
}
function startMockWith(list, meta){
  MK={ qs:list, i:0, limit:+(document.getElementById("mkTime").value||150),
       items:list.map(q=>({id:q.id,q:q.q,co:q.co,type:q.type,ans:"",score:0,fail:[]})),
       start:Date.now(), meta };
  document.getElementById("mockSetup").style.display="none";
  document.getElementById("mockReport").style.display="none";
  document.getElementById("mockRun").style.display="";
  showQ();
}
function showQ(){
  const q=MK.qs[MK.i];
  document.getElementById("mkNum").textContent=`第 ${MK.i+1} / ${MK.qs.length} 题`;
  document.getElementById("mkQ").textContent=q.q;
  document.getElementById("mkTagCo").textContent=(q.co||"")+" · "+(q.round||"");
  document.getElementById("mkTagType").textContent=(q.type||"")+(q.src?" · "+q.src:"");
  document.getElementById("mkHintBody").textContent=q.hint||"（这题没有预置框架，靠你自己搭）";
  document.getElementById("mkHint").style.display="none";
  document.getElementById("mkAns").value=MK.items[MK.i].ans||"";
  document.getElementById("mkBar").style.width=(MK.i/MK.qs.length*100)+"%";
  document.getElementById("mkNext").textContent = MK.i===MK.qs.length-1 ? "提交并看报告 →" : "下一题 →";
  renderRate(MK.items[MK.i].score); renderMkFail(); startTimer();
}
function renderRate(cur){
  document.getElementById("mkRate").innerHTML=[1,2,3,4,5].map(n=>`<button class="${n===cur?"on":""}" onclick="setRate(${n})">${n}</button>`).join("");
}
function setRate(n){ MK.items[MK.i].score=n; renderRate(n); renderMkFail(); }
function renderMkFail(){
  const box=document.getElementById("mkFail"); if(!box) return;
  const it=MK.items[MK.i];
  box.style.display = (it.score&&it.score<=3)? "" : "none";
  box.innerHTML = `<div class="muted" style="margin-bottom:6px">答得不好？标一下原因（会进归因统计）</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${FAIL_MODES.map(f=>
      `<span class="chip" style="padding:4px 10px;font-size:12px${(it.fail||[]).includes(f)?';background:var(--red);border-color:var(--red);color:#fff':''}" onclick="toggleMkFail('${f}')">${f}</span>`).join("")}</div>`;
}
function toggleMkFail(f){ const it=MK.items[MK.i]; it.fail=it.fail||[];
  const k=it.fail.indexOf(f); if(k>=0) it.fail.splice(k,1); else it.fail.push(f); renderMkFail(); }
function startTimer(){
  clearInterval(mkTimerId);
  const el=document.getElementById("mkTimer");
  if(!MK.limit){ el.textContent="∞"; el.className="timer"; return; }
  let left=MK.limit;
  const tick=()=>{ const m=Math.floor(Math.abs(left)/60), s=Math.abs(left)%60;
    el.textContent=(left<0?"-":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
    el.className="timer"+(left<0?" over":left<=30?" warn":""); left--; };
  tick(); mkTimerId=setInterval(tick,1000);
}
function toggleHint(){ const h=document.getElementById("mkHint"); h.style.display=h.style.display==="none"?"":"none"; }
function nextQ(skip){
  MK.items[MK.i].ans = skip? "" : document.getElementById("mkAns").value;
  if(skip){ MK.items[MK.i].score=0; MK.items[MK.i].fail=[]; }
  if(MK.i<MK.qs.length-1){ MK.i++; showQ(); } else finishMock();
}
function quitMock(){ if(!confirm("退出会丢失本次作答，确定？")) return;
  clearInterval(mkTimerId); MK=null;
  document.getElementById("mockRun").style.display="none"; document.getElementById("mockSetup").style.display=""; }
function finishMock(){
  clearInterval(mkTimerId);
  const rec={ id:uid("m"), date:new Date().toLocaleString("zh-CN"), meta:MK.meta,
    mins:Math.max(1,Math.round((Date.now()-MK.start)/60000)), items:MK.items };
  S.mocks.push(rec); save();
  document.getElementById("mockRun").style.display="none";
  document.getElementById("mockReport").style.display="";
  document.getElementById("mockReport").innerHTML=reportHTML(rec);
  renderDash();
}

        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="width:64px;font-size:12.5px;flex:0 0 64px">${t}</span>
          <div style="flex:1;height:16px;background:#F2F3F5;border-radius:8px;overflow:hidden"><div style="width:${a/5*100}%;height:100%;background:${a>=4?"var(--green)":a>=3?"var(--orange)":"var(--red)"}"></div></div>
          <b style="width:28px;text-align:right;font-size:12.5px">${a.toFixed(1)}</b></div>`;}).join("") : '<div class="muted">没有打分</div>'}
    </div>
    <div class="card pad"><div class="sechead">本轮失败模式</div>
      ${Object.keys(fm).length? Object.entries(fm).sort((a,b)=>b[1]-a[1]).map(([f,n])=>
        `<div style="padding:6px 0;border-bottom:1px solid #F4F4F4;font-size:13px"><span class="tag t-red">${n}</span> ${esc(f)}</div>`).join("")
        : '<div class="muted">没有标记失败模式</div>'}
    </div>
    <div class="card pad"><div class="sechead">重点攻克（≤2 星）</div>
      ${weak.length? weak.map(i=>`<div style="padding:7px 0;border-bottom:1px solid #F2F2F2;font-size:13px"><span class="tag t-red">${i.score}★</span> ${esc(i.q)}</div>`).join("")

  </div>
  <div style="height:16px"></div>
  <div class="card pad"><div class="sechead">逐题回看</div>
    ${rec.items.map((i,n)=>`<div style="border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px">

function ivSaveStar(expId){

    <tbody>${list.map(c=>rdRow(c,hasFit,cols)).join("")||`<tr><td colspan="${cols}" class="empty-cell">没有匹配的公司，换个关键词或类别。</td></tr>`}</tbody>
  </table></div>
  <form class="add-row" onsubmit="event.preventDefault();rdAddCustom()"><span>没有你想投的公司？</span><input class="inp" id="rdNewCo" placeholder="公司名" aria-label="公司名"><input class="inp" id="rdNewUrl" placeholder="校招岗位列表页网址 https://…" aria-label="岗位列表页网址"><button class="btn sm">添加并监控</button></form>`;
}
function rdRow(c,hasFit,cols){
  const k=esc(c.co).replace(/'/g,"&#39;"), open=RD.open===c.co;
  const st=c.busy?`<span class="st st-busy"><i></i>刷新中</span>`:c.needs?`<span class="st st-warn"><i></i>${esc(c.needs)}</span>`:c.on?`<span class="st st-on"><i></i>监控中</span>`:(c.auto?`<span class="st st-off"><i></i>未监控</span>`:`<span class="st st-man" title="这家官网要先选好应聘项目 / 岗位类别（或登录）才显示岗位，插件读不到。展开这一行，把筛好后的网址贴进来就能监控">需手动选类别</span>`);
  return `<tr class="${open?"is-open":""} ${c.on?"is-on":""}" onclick="RD.open=RD.open==='${k}'?'':'${k}';renderRadar()" aria-expanded="${open}">
    <td class="co"><span class="rd-co"><span class="rd-mono" aria-hidden="true">${rdMono(c.co)}</span><b>${esc(c.co)}</b>${c.direct?`<span class="rd-direct" title="本机后端直接读取${esc(c.direct)}接口，不需要插件">直读</span>`:""}</span></td><td class="muted hide-sm nowrap">${esc(c.cat)}</td>${hasFit?`<td class="num hide-sm">${c.fit||"–"}</td>`:""}<td>${st}</td>
    <td class="num">${c.jobs.length||"–"}</td><td class="num hide-sm">${c.fresh||"–"}</td><td class="num hide-sm">${c.good||"–"}</td><td class="muted num hide-sm">${c.last?rdAgo(c.last):"–"}</td>
    <td class="act" onclick="event.stopPropagation()">${c.on?`<button class="btn sm" onclick="rdRefresh('${k}')" ${AP.running?"disabled":""}>刷新</button>`:c.auto?`<button class="btn sm" onclick="rdWatch('${k}')">监控</button>`:""}<a class="btn sm ghost" href="${esc(c.url)}" target="_blank" rel="noopener">官网</a></td></tr>
    ${open?`<tr class="detail"><td colspan="${cols}">${rdDetail(c)}</td></tr>`:""}`;
}
function rdDetail(c){
  const cur=c.cur, k=esc(c.co).replace(/'/g,"&#39;");
  const jobs=c.jobs.slice().sort((a,b)=>(b.found||"").localeCompare(a.found||"")).slice(0,40);
  return `<div class="dt">
    <div class="dt-main">
      ${jobs.length?`<table class="tbl tbl-in"><thead><tr><th>岗位</th><th>城市</th><th class="num">匹配</th><th>发现</th><th>结果</th></tr></thead><tbody>${jobs.map(x=>`<tr><td>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.role)}</a>`:esc(x.role)}</td><td class="muted">${esc(x.city||"–")}</td><td class="num">${x.score!=null?x.score:"–"}</td><td class="muted num">${rdAgo(x.found)}</td><td class="muted">${esc(rdStatus(x))}</td></tr>`).join("")}</tbody></table>`
        :`<p class="muted">${c.on?"还没刷到岗位。点「刷新」读取这家的在招岗位。":c.auto?"点「监控」后，平台刷新时会读取这家的在招岗位。":"这家的岗位列表需要先在官网上选项目或职能。"}</p>`}
      ${!c.auto?`<div class="fix"><label for="rdFixUrl">筛好后的岗位列表页网址</label><div><input class="inp" id="rdFixUrl" placeholder="打开官网，选好项目和职能，复制地址栏"><button class="btn sm" onclick="rdFix('${k}')">保存并监控</button></div></div>`:""}
    </div>
    ${cur?`<div class="dt-side"><h3>为什么适合你</h3><p>${esc(cur.why||"")}</p>${(cur.roles||[]).length?`<h3>建议方向</h3><p>${cur.roles.map(esc).join("、")}</p>`:""}${cur.gate?`<h3>投递前核对</h3><p>${esc(cur.gate)}</p>`:""}</div>`:""}
    ${c.on?`<div class="dt-foot"><button class="btn sm ghost" onclick="rdUnwatch('${k}')">取消监控</button></div>`:""}
  </div>`;
}
function rdStatus(x){ return {review:"待你审核",skip:x.reason||"已跳过",ready:"值得投 · 简历已生成",opened:"网申已打开",filled:"网申已自动填写",submitted:"已投递",blocked:x.needs||"需要你处理",error:x.reason||"需要你处理"}[x.status]||"处理中"; }
function rdOpen(co){ RD.tab="co"; RD.open=co; go("radar"); }
/* 城市很多时只显示前 3 个，完整列表放在提示里 */
function rdCity(c){ const xs=String(c||"").split(/[、,，\s]+/).filter(Boolean).map(x=>x.replace(/^[^·]*·/,"").replace(/[市省]$/,"")); if(!xs.length) return "–"; const u=[...new Set(xs)]; return u.length>3?`<span title="${esc(u.join("、"))}">${esc(u.slice(0,3).join("、"))} 等 ${u.length} 地</span>`:esc(u.join("、")); }
function rdJobsHTML(jobs){
  const st={review:"待审核",good:"值得投",all:"全部",skip:"已跳过",needs:"需要处理",done:"已投递"};
  const is={review:x=>x.status==="review",good:x=>["ready","opened","filled"].includes(x.status),skip:x=>x.status==="skip",needs:x=>["blocked","error"].includes(x.status),done:x=>x.status==="submitted",all:()=>true};
  if(!jobs.length) return `<div class="empty-block"><h2>还没有发现岗位</h2><p>在「公司」里监控几家公司并刷新。平台会读取每个岗位的 JD，按你的经历打分，值得投的自动生成简历。</p><button class="btn" onclick="RD.tab='co';renderRadar()">选择公司</button></div>`;
  if(!RD.jstSet){ RD.jst=jobs.some(is.review)?"review":jobs.some(is.good)?"good":"all"; }
  let list=jobs.filter(is[RD.jst]||is.all);
  if(RD.jq) list=list.filter(x=>(x.company+x.role+(x.city||"")).toLowerCase().includes(RD.jq.toLowerCase()));
  const byScore=RD.jsort==="score";
  list.sort((a,b)=>byScore?(b.score||0)-(a.score||0):(b.found||"").localeCompare(a.found||""));
  return `<div class="toolbar">
    <div class="seg" role="group" aria-label="按结果筛选">${Object.entries(st).map(([k,n])=>`<button class="${RD.jst===k?"on":""}" onclick="RD.jst='${k}';RD.jstSet=1;renderRadar()">${n} <span class="num">${jobs.filter(is[k]).length}</span></button>`).join("")}</div>
    <label class="search">${qzIcon("search",15)}<input value="${esc(RD.jq)}" placeholder="搜公司、岗位、城市" aria-label="搜公司、岗位、城市" oninput="RD.jq=this.value;clearTimeout(RD._t);RD._t=setTimeout(()=>{renderRadar();const i=document.querySelector('.search input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)"></label>
  </div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr>
    <th class="hide-sm" aria-sort="${byScore?"none":"descending"}"><button onclick="RD.jsort='time';renderRadar()">发现${byScore?"":" ↓"}</button></th><th>公司</th><th>岗位</th><th class="hide-sm">城市</th>
    <th class="num" aria-sort="${byScore?"descending":"none"}"><button onclick="RD.jsort='score';renderRadar()">匹配${byScore?" ↓":""}</button></th><th>结果</th><th class="act"><span class="sr">操作</span></th></tr></thead><tbody>
  ${list.slice(0,300).map(x=>`<tr><td class="muted num nowrap hide-sm">${esc(rdAgo(x.found))}</td><td class="nowrap"><b>${esc(x.company)}</b></td><td>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.role)}</a>`:esc(x.role)}</td><td class="muted hide-sm rd-city">${rdCity(x.city)}</td>
    <td class="num">${x.score!=null?`<span class="score ${x.score>=75?"hi":x.score>=55?"mid":""}">${x.score}</span>`:"–"}</td><td class="${is.good(x)?"":"muted"}">${esc(rdStatus(x))}</td>
    <td class="act">${x.status==="review"?`<button class="btn sm" onclick="go('auto')">去审核</button>`:x.status==="skip"?`<button class="btn sm ghost" onclick="apPromote('${x.id}');renderRadar()">还是要投</button>`:is.good(x)?`<button class="btn sm ghost" onclick="apAskAI('${x.id}')">问 AI</button><button class="btn sm" onclick="apOpen('${x.id}')">去网申</button>`:""}</td></tr>`).join("")||`<tr><td colspan="7" class="empty-cell">没有符合条件的岗位</td></tr>`}
  </tbody></table></div>`;
}
function rdWatch(co){ const c=rdCompanies().find(x=>x.co===co); if(!c) return; const A=apS();
  if(c.src){ c.src.on=true; } else A.sources.push({id:uid("s"),name:c.co+"校招",company:rdKey(c.co),url:c.url,on:true});
  save(); renderRadar(); toast(`已监控 ${c.co}，下次刷新会读取它的在招岗位`); }
function rdUnwatch(co){ const c=rdCompanies().find(x=>x.co===co); if(c&&c.src){ c.src.on=false; save(); renderRadar(); } }
function rdFix(co){ const url=(document.getElementById("rdFixUrl").value||"").trim(); if(!/^https?:\/\//.test(url)) return toast("粘贴完整网址（https:// 开头）");
  const c=rdCompanies().find(x=>x.co===co); const A=apS();
  if(c&&c.src){ c.src.url=url; c.src.on=true; } else A.sources.push({id:uid("s"),name:co+"校招",company:rdKey(co),url,on:true});
  save(); closeModal(); renderRadar(); toast("已保存，平台会用这个列表页刷新"); }
function rdAddCustom(){
  const co=(document.getElementById("rdNewCo").value||"").trim(), url=(document.getElementById("rdNewUrl").value||"").trim();
  if(!co) return toast("填公司名"); if(!/^https?:\/\//.test(url)) return toast("填完整的岗位列表页网址");
  apS().sources.push({id:uid("s"),name:co+"校招",company:co,url,on:true}); save(); renderRadar(); toast(`已添加 ${co}`);
}
function rdRefresh(co){
  const c=rdCompanies().find(x=>x.co===co); if(!c||!c.src) return;
  if(!apExtReady()) return agExtHelp();
  apRun({only:[c.src.id],noOpen:true});
}
function rdRefreshAll(){
  if(!apExtReady()) return agExtHelp();
  if(!apS().sources.some(s=>s.on)) return rdWatchAll();
  apRun({noOpen:true,full:true});
}
function rdVisible(){ const v=document.getElementById("v-radar"); return v&&v.classList.contains("on"); }

/*@/QZ:radar.js*/
boot();
</script>
</body></html>
